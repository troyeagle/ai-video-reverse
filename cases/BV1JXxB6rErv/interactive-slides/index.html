<script id="deck-data" type="application/json">{"title":"《求是》连发三文，供强需弱的本质和顶层政策思路是什么","author":"原点公社","source":"https://www.bilibili.com/video/BV1JXxB6rErv/","caseId":"BV1JXxB6rErv","duration":465.0,"slides":[{"id":1,"start":0,"end":12,"title":"《求是》三文：供强需弱","phaseName":"封面 · 00:00","scene":"cover","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"00:00—00:12","cues":[{"start":0.0,"end":8.32,"text":"从9月中旬到10月中旬，《求是》杂志连续三期刊发评论员文章，讨论的都是同一个主题，供强需弱。"}],"auditIds":["Q01","Q10"],"narration_free":false,"empty_reason":""},{"id":2,"start":12,"end":24,"title":"9月中旬—10月中旬：三期同题","phaseName":"刊期 · 00:12","scene":"timeline","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"00:12—00:24","cues":[{"start":8.86,"end":15.64,"text":"一个月之内，在《求是》这种规格的刊物上，连续三期讨论同一个经济问题，这本身就极为少见。"},{"start":16.04,"end":23.24,"text":"所以，如果我们仅从表面上理解是消费比较弱，《求是》连续发文强调扩大内需，那就太过于浅显。"}],"auditIds":["Q01","Q10"],"narration_free":false,"empty_reason":""},{"id":3,"start":24,"end":36,"title":"只看消费偏弱，解释还不够","phaseName":"关键论断 · 00:24","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"00:24—00:36","cues":[{"start":23.24,"end":24.94,"text":"这也不是《求是》的格局。"},{"start":25.28,"end":34.22,"text":"三篇文章连起来看，讨论的已经不只是怎么让消费更多一点，而是顺着消费这条线，在叩问一个更大的问题。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":4,"start":36,"end":48,"title":"过去几十年的增长模式，怎样调整","phaseName":"关键论断 · 00:36","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"00:36—00:48","cues":[{"start":34.8,"end":39.18,"text":"中国过去几十年形成的增长模式，到了今天应该怎么调整？"},{"start":39.56,"end":42.3,"text":"现在聊到中国经济，一个经常出现的判断就是，"},{"start":42.94,"end":46.3,"text":"中国的生产能力很强，但国内需求相对偏弱。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":5,"start":48,"end":60,"title":"第一篇：立足优势","phaseName":"文章要旨 · 00:48","scene":"article","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"00:48—01:00","cues":[{"start":46.3,"end":53.54,"text":"《求是》这三篇文章中的第一篇《立足优势》，着力破解，供强需弱矛盾，就是给这个问题重新定性。"},{"start":53.980000000000004,"end":57.4,"text":"他没有否认需求不足，他承认供强需弱存在。"},{"start":57.92,"end":60.8,"text":"但文章并不认为强大的供给是一个问题。"}],"auditIds":["Q01","Q02"],"narration_free":false,"empty_reason":""},{"id":6,"start":60,"end":72,"title":"承认矛盾，同时保留供给优势","phaseName":"两种机制 · 01:00","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:00—01:12","cues":[{"start":61.34,"end":68.86,"text":"因为中国完整的工业体系，强大的制造能力，产业链优势，本身仍然是中国最重要的竞争优势之一。"}],"auditIds":["Q02"],"narration_free":false,"empty_reason":""},{"id":7,"start":72,"end":84,"title":"需求没有同步跟上供给扩张","phaseName":"关键论断 · 01:12","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:12—01:24","cues":[{"start":68.86,"end":78.92,"text":"所以，第一篇真正想说的是，现在要解决的不是中国生产能力太强，而是国内有效需求增长，没有完全跟上供给能力，"},{"start":79.02,"end":80.44,"text":"扩张和升级的速度。"},{"start":80.74,"end":84.76,"text":"这两个判断看上去差别很小，政策含义却完全不同。"}],"auditIds":["Q02"],"narration_free":false,"empty_reason":""},{"id":8,"start":84,"end":108,"title":"不同判断，导向不同政策","phaseName":"两种机制 · 01:24","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:24—01:48","cues":[{"start":85.30000000000001,"end":90.46,"text":"如果认为问题是生产太多，最直接的办法就是压投资，压产能。"},{"start":90.92,"end":98.92,"text":"但如果认为问题是需求没有跟上来，政策方向就会变成供给优势要保留，同时把需求这一端也补起来。"},{"start":99.44,"end":107.84,"text":"这也是为什么第二篇以改革发力破解供强需弱矛盾特别重要，因为它开始顺着这个思路继续往下思考。"}],"auditIds":["Q07","Q09"],"narration_free":false,"empty_reason":""},{"id":9,"start":108,"end":120,"title":"第二篇：以改革发力","phaseName":"文章要旨 · 01:48","scene":"article","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:48—02:00","cues":[{"start":108.54,"end":114.16,"text":"为什么我们的生产能力能够这么快地增长，但居民需求没有以同样的速度增长？"},{"start":114.66,"end":117.92,"text":"答案其实和过去几十年的发展模式有关。"},{"start":117.92,"end":121.86,"text":"改革开放以后，中国长期面对的一个问题是短缺。"}],"auditIds":["Q01","Q02"],"narration_free":false,"empty_reason":""},{"id":10,"start":120,"end":144,"title":"从短缺出发的生产体系","phaseName":"机制演示 · 02:00","scene":"flow","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:00—02:24","cues":[{"start":122.14,"end":126.04,"text":"缺道路，缺电力，缺住房，缺工厂，缺工业品。"},{"start":126.48,"end":132.96,"text":"所以整个经济体系都围绕一个目标建立，扩大投资，扩大生产，扩大出口。"},{"start":133.6,"end":138.32,"text":"地方政府最熟悉的工作是招商引资，建开发区修基础设施。"},{"start":138.68,"end":146.12,"text":"在这个背景下，土地资金政策的支持也更多是围绕扩大生产能力来配置的。"}],"auditIds":["Q07"],"narration_free":false,"empty_reason":""},{"id":11,"start":144,"end":156,"title":"地方政府与生产端的资源配置","phaseName":"机制演示 · 02:24","scene":"flow","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:24—02:36","cues":[{"start":146.66000000000003,"end":156.42,"text":"这套体系在过去的三十年非常成功，所以今天中国拥有了全球最完整的工业体系，也形成了极强的制造能力。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":12,"start":156,"end":168,"title":"工业体系与制造能力","phaseName":"两种机制 · 02:36","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:36—02:48","cues":[{"start":156.92000000000002,"end":163.86,"text":"可问题在于，创造生产能力的机制非常强，创造居民最终购买力的机制并没有同步跟上。"},{"start":163.86,"end":167.28,"text":"第二篇，求是也明确地把这个点了出来。"}],"auditIds":["Q02"],"narration_free":false,"empty_reason":""},{"id":13,"start":168,"end":180,"title":"资源配置、收入分配与社会保障","phaseName":"关键论断 · 02:48","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:48—03:00","cues":[{"start":167.86,"end":179.24,"text":"原文是，过去的资源配置和政策取向更多向生产领域倾斜，同时收入分配制度、社会保障等因素又会影响居民的消费能力和消费意愿。"}],"auditIds":["Q03","Q06"],"narration_free":false,"empty_reason":""},{"id":14,"start":180,"end":204,"title":"收入在政府、企业、居民间怎样分配","phaseName":"关键论断 · 03:00","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:00—03:24","cues":[{"start":179.76,"end":186.58,"text":"到了这里，供强需弱就不再只是一个消费和生产的问题，而变成了另外一个问题。"},{"start":187.26,"end":192.9,"text":"整个经济创造出来的收入最后在政府、企业和居民之间是怎么分配的？"},{"start":193.38,"end":200.1,"text":"一个普通家庭一年挣到的钱，除了日常生活还要考虑住房、教育、医疗、养老。"}],"auditIds":["Q03"],"narration_free":false,"empty_reason":""},{"id":15,"start":204,"end":216,"title":"家庭的未来支出与储蓄选择","phaseName":"机制演示 · 03:24","scene":"flow","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:24—03:36","cues":[{"start":200.68,"end":207.84,"text":"如果这些未来支出存在很大的不确定性，那么哪怕今天收入增加了一点，家庭的第一反应也可能不是消费，"},{"start":208.1,"end":209.36,"text":"而是先储蓄。"},{"start":209.7,"end":216.28,"text":"所以在去年投资于人刚刚被提出来的时候，我们就专门做节目解说过，这是一个重大的转向。"}],"auditIds":["Q03","Q11"],"narration_free":false,"empty_reason":""},{"id":16,"start":216,"end":228,"title":"投资于人：社会保障与消费预期","phaseName":"关键论断 · 03:36","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:36—03:48","cues":[{"start":216.68,"end":219.86,"text":"投资于人的一个重要内容就是加强社会保障。"},{"start":220.39999999999998,"end":227.22,"text":"过去一说扩大内需，我们最容易想到的是消费券，以旧换新、降息、促销。"}],"auditIds":["Q03","Q11"],"narration_free":false,"empty_reason":""},{"id":17,"start":228,"end":252,"title":"今天的购买力与未来的安全感","phaseName":"两种机制 · 03:48","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:48—04:12","cues":[{"start":227.52,"end":236.08,"text":"这些工具当然重要，但它们解决的更多是，今天有没有购买力而收入分配、工资增长和社会保障解决的事。"},{"start":236.58,"end":239.7,"text":"未来有没有能力、有没有安全感持续消费？"},{"start":239.96,"end":249.56,"text":"这两者不是一回事，所以现在扩大内需的政策正在越来越多的从一项单纯的消费政策进入收入政策、财政政策和社会政策。"},{"start":249.86,"end":254.04,"text":"第二篇里面有一个很典型的例子，就是消费税改革。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":18,"start":252,"end":264,"title":"从消费政策进入收入、财政与社会政策","phaseName":"关键论断 · 04:12","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"04:12—04:24","cues":[{"start":254.34,"end":259.04,"text":"消费税征收环节后移并稳步下划地方，并不是最近才第一次提出。"},{"start":259.56,"end":263.82,"text":"但为什么求是会把它放进破解供强需弱的文章里？"}],"auditIds":["Q03","Q07"],"narration_free":false,"empty_reason":""},{"id":19,"start":264,"end":288,"title":"消费税改革与地方激励","phaseName":"消费税改革 · 04:24","scene":"tax","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"04:24—04:48","cues":[{"start":264.24,"end":271.9,"text":"因为它真正要改变的是地方政府的激励机制，过去一个地方想增加财政收入，最熟悉的路径是什么？"},{"start":272.54,"end":274.94,"text":"引进企业建工厂扩大投资，"},{"start":275.54,"end":278.38,"text":"所以地方政府天然非常重视生产。"},{"start":278.92,"end":286.36,"text":"如果未来地方财政收入和终端消费之间的联系增加，那么地方政府才会更有动力，关心居民收入高不高，"}],"auditIds":["Q04"],"narration_free":false,"empty_reason":""},{"id":20,"start":288,"end":312,"title":"让地方更关心收入、服务与消费","phaseName":"消费税改革 · 04:48","scene":"tax","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"04:48—05:12","cues":[{"start":286.64,"end":291.3,"text":"消费环境好不好，服务业发不发达，人口愿不愿意留下来。"},{"start":291.3,"end":301.72,"text":"所以消费税改革真正重要的地方不是多收或者少收一笔税，而是让地方政府也有动力去培育消费，而不仅仅是有动力扩大生产。"},{"start":302.0,"end":313.02,"text":"这就是为什么我们认为供强需弱真正开始进入体制改革以后，问题会变得比发消费券复杂得多，因为它涉及的不是一个部门，"}],"auditIds":["Q04"],"narration_free":false,"empty_reason":""},{"id":21,"start":312,"end":324,"title":"第三篇：以政策协同","phaseName":"文章要旨 · 05:12","scene":"article","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:12—05:24","cues":[{"start":313.28,"end":315.18,"text":"而是整个经济运行方式。"},{"start":315.65999999999997,"end":320.72,"text":"这也就自然进入了第三篇，以政策协同破解，供强需弱矛盾。"}],"auditIds":["Q01","Q05"],"narration_free":false,"empty_reason":""},{"id":22,"start":324,"end":348,"title":"生产、分配、流通、消费","phaseName":"经济循环 · 05:24","scene":"cycle","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:24—05:48","cues":[{"start":321.08,"end":327.36,"text":"这篇文章他把这个问题拆成了四个环节，生产、分配、流通、消费。"},{"start":327.92,"end":333.18,"text":"生产端有些领域存在中低端供给过剩和优质供给不足并存。"},{"start":333.82,"end":338.42,"text":"分配端居民增收收入分配、社保和公共服务仍然需要完善。"},{"start":338.94,"end":344.5,"text":"流通端全国统一大市场还没有完全形成，地方保护和市场分割仍然存在。"},{"start":345.18,"end":350.1,"text":"到了消费端、就业、收入预期和家庭支出压力又影响消费意愿。"}],"auditIds":["Q05"],"narration_free":false,"empty_reason":""},{"id":23,"start":348,"end":360,"title":"无法靠一个政策独自解决","phaseName":"关键论断 · 05:48","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:48—06:00","cues":[{"start":350.64,"end":355.32,"text":"这样拆解后，结论就很清楚了，供强需弱不可能靠一个政策解决。"},{"start":355.94,"end":362.36,"text":"如果只增加财政刺激，但居民长期收入预期没有改变，刺激结束以后，消费可能又回去。"}],"auditIds":["Q05"],"narration_free":false,"empty_reason":""},{"id":24,"start":360,"end":384,"title":"几个政策失配的例子","phaseName":"两种机制 · 06:00","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:00—06:24","cues":[{"start":362.98,"end":369.06,"text":"如果只提高居民收入，但地方仍然不断推动同质化投资，供给端可能增长得更快。"},{"start":369.62,"end":376.26,"text":"如果一边刺激消费，一边房地产继续压制家庭资产负债表，那么家庭仍然可能选择储蓄。"},{"start":376.54,"end":382.9,"text":"所以第三篇才反复强调，财政和金融要协同，宏观政策和改革要协同，"}],"auditIds":["Q05","Q08"],"narration_free":false,"empty_reason":""},{"id":25,"start":384,"end":396,"title":"财政金融、改革、民生与预期协同","phaseName":"政策协同 · 06:24","scene":"policy","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:24—06:36","cues":[{"start":383.56,"end":385.78,"text":"经济发展和民生改善要协同，"},{"start":386.5,"end":388.94,"text":"政策本身还要进行一致性评估。"},{"start":389.58,"end":393.96,"text":"说到底，是因为这个问题同时存在于整个经济循环里面。"}],"auditIds":["Q05"],"narration_free":false,"empty_reason":""},{"id":26,"start":396,"end":420,"title":"保留优势，同时改变增长依赖","phaseName":"两种机制 · 06:36","scene":"two","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:36—07:00","cues":[{"start":394.41999999999996,"end":400.4,"text":"所以，现在回头看这三篇文章，我认为他们真正要处理的是一个非常困难的平衡。"},{"start":400.96,"end":409.52,"text":"中国不能因为现在需求偏弱，就把过去几十年建立起来的强大制造能力削弱掉，但也不能继续只依靠扩大投资，"},{"start":409.66,"end":412.04,"text":"扩大生产能力来解决增长问题。"},{"start":412.04,"end":422.58,"text":"未来真正需要做的是在保留和升级供给优势的同时，建立一套更强的国内需求形成机制，让居民能够获得更多收入，"}],"auditIds":["Q07","Q09"],"narration_free":false,"empty_reason":""},{"id":27,"start":420,"end":432,"title":"建立更强的需求形成机制","phaseName":"政策协同 · 07:00","scene":"policy","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:00—07:12","cues":[{"start":423.22,"end":426.04,"text":"让社会保障减少家庭对未来的担忧，"},{"start":426.7,"end":436.54,"text":"让地方政府不仅愿意招商建工厂，也愿意培育消费和服务业，让市场能够淘汰真正低效的供给，而不是简单行政限产，"}],"auditIds":["Q07"],"narration_free":false,"empty_reason":""},{"id":28,"start":432,"end":444,"title":"让市场淘汰低效供给","phaseName":"关键论断 · 07:12","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:12—07:24","cues":[{"start":437.1,"end":447.54,"text":"最终让国内需求能够跟上生产能力增长的速度，所以供强需弱最终不是一道简单的消费题，它实际上是增长模式的再平衡，"}],"auditIds":["Q09"],"narration_free":false,"empty_reason":""},{"id":29,"start":444,"end":456,"title":"增长模式的再平衡","phaseName":"关键论断 · 07:24","scene":"quote","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:24—07:36","cues":[{"start":447.88,"end":457.8,"text":"真正要改变的不是中国强大的生产能力，而是让一个特别擅长生产的经济体系，进一步拥有一套同样强大的需求形成机制，"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":30,"start":456,"end":465.0,"title":"两端共同调整：供给与需求","phaseName":"总结 · 07:36","scene":"conclusion","theme":"editorial","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:36—07:45","cues":[{"start":458.46,"end":464.76,"text":"既不能靠压缩生产能力来解决需求不足，也不能继续只靠扩大生产能力来创造增长。"}],"auditIds":["Q07","Q09"],"narration_free":false,"empty_reason":""}],"data":{},"audit":{"summary":"求是三篇原文对照：区分忠实转述、作者推演及待补证表述","findings":[{"id":"Q01","status":"pass","title":"三期及文章对应关系成立","claim":"9月中旬至10月中旬，连续三期同主题。","evidence":"求是网原文确为2026/18、19、20期，发布时间9月16日、10月1日、10月16日；作者均为本刊评论员。","times":[0,12,48,108,312],"sources":["S1","S2","S3"],"calculation":"","scope":""},{"id":"Q02","status":"pass","title":"供需相对错配与供给优势主线有依据","claim":"需求增长未同步跟上供给扩张和升级。","evidence":"S1讨论有效需求扩张相对滞后，并强调供给体系和市场优势；S2解释阶段与模式转变中的错配、梗阻。","times":[48,60,72,108,156],"sources":["S1","S2"],"calculation":"","scope":""},{"id":"Q03","status":"pass","title":"收入分配、社保与消费机制对应原文","claim":"收入分配、社会保障影响消费能力和意愿。","evidence":"S2明确论述收入分配制度和社会保障制约消费，强调就业、收入预期与长效机制。","times":[168,180,204,216,252],"sources":["S2"],"calculation":"","scope":""},{"id":"Q04","status":"pass","title":"消费税改革与地方激励的联系有依据","claim":"后移征收环节、下划地方，改变重生产轻消费取向。","evidence":"S2确实提出该改革并将其与资源配置从重生产轻消费向平衡发展联系；视频使用未来条件，没有宣称已全部落地。","times":[264,276,288,300],"sources":["S2"],"calculation":"","scope":""},{"id":"Q05","status":"pass","title":"四环节与四种协同对应第三文","claim":"生产、分配、流通、消费；财政金融等协同。","evidence":"S3按四环节分析，并分别讨论财政金融、宏观政策与改革、发展与民生、实施与预 <script>const DECK=JSON.parse(document.getElementById('deck-data').textContent);let CHECKED_VIEW=false, AUDIT_ALL=false, GALLERY_DIFFS=false;
function comparisonFor(s){return s.comparison??(DECK.caseId==='BV1JXxB6rErv'?{kind:'source',label:'原文对照',summary:'并列查看作者重点与求是原文依据；这不等于本页存在错误。',original:s.title,checked:DECK.audit.findings.find(c=>s.auditIds.includes(c.id))?.evidence??'本页为作者概括；原文出处和完整审计见右侧。',auditIds:s.auditIds}:null);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(html,n=1,extra='')=>`<div class="fragment ${extra}" data-order="${n}">${html}</div>`;
const color=v=>v<40?'#58aa76':v<60?'#d5b64a':v<80?'#d78246':'#cf5061';

function axes(max=100,labels=[]){let s='';for(let v=0;v<=max;v+=max/5){let y=285-v/max*250;s+=`<line class="grid" x1="65" y1="${y}" x2="890" y2="${y}"/><text x="47" y="${y+5}" font-size="13" text-anchor="end">${Math.round(v)}</text>`;}return s;}
function bars(labels,series,max=100){let s=axes(max);const groupWidth=790/labels.length,colors=['#4897a6','#df9c49','#cb6c7e','#74b582'];series.forEach((row,j)=>row.values.forEach((v,i)=>{const x=83+i*groupWidth+j*(groupWidth/(series.length+1));if(v===null){s+=`<text x="${x+12}" y="272" font-size="11">未给</text>`;return;}const h=v/max*250,w=groupWidth/(series.length+1)-10;s+=`<rect class="bar" x="${x}" y="${285-h}" width="${w}" height="${h}" fill="${row.color??colors[j]}"/><text x="${x+w/2}" y="${276-h}" font-size="14" text-anchor="middle">${v}</text>`;}));labels.forEach((l,i)=>s+=`<text x="${83+i*groupWidth+groupWidth*.35}" y="311" font-size="14" text-anchor="middle">${esc(l)}</text>`);s+=series.map((row,j)=>`<rect x="${75+j*235}" y="4" width="12" height="12" fill="${row.color??colors[j]}"/><text x="${94+j*235}" y="15" font-size="13">${esc(row.name)}</text>`).join('');return F(`<svg class="deck-chart" viewBox="0 0 920 330" role="img" aria-label="数值柱状图">${s}</svg>`,2);}
function table(which){const rows=DECK.data[which];return F(`<table class="data-table"><thead><tr><th>省份</th><th>人均一般预算收入（元）</th><th>综合分</th><th>分区</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1].toLocaleString('en-US')}</td><td class="score" style="background:${color(x[2])}">${x[2]}</td><td>${x[2]<40?'绿':x[2]<60?'黄':x[2]<80?'橙':'红'}</td></tr>`).join('')}</tbody></table>`,1)+legend();}
function ranking(){const rows=[...DECK.data.high,...DECK.data.low].sort((a,b)=>b[2]-a[2]);return F(`<div class="rank-grid">${rows.map(x=>`<div class="rank-row"><label>${x[0]}</label><span class="rank-track"><i style="width:${x[2]}%;background:${color(x[2])}"></i></span><b>${x[2]}</b></div>`).join('')}</div>`,1)+legend();}
function weights(){return `<div class="model-cards">${DECK.data.blocks.names.map((name,i)=>F(`<div class="model-card"><h3>${name}</h3><svg viewBox="0 0 100 100" style="width:88px;height:88px"><circle cx="50" cy="50" r="40" fill="none" stroke="#84988933" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="${['#72bd95','#d9bf58','#d98747','#609faa'][i]}" stroke-width="9" stroke-dasharray="${DECK.data.blocks.weights[i]*2.513} 251.3" transform="rotate(-90 50 50)"/></svg><div class="weight">${DECK.data.blocks.weights[i]}%</div><p>${['一般公共预算收入底盘','收入与支出进度','存量债务及限额空间','融资与到期接续'][i]}</p></div>`,i+1)).join('')}</div>`;}
function scatter(){const points=CHECKED_VIEW?[['贵州',35.85,871.2],['吉林',33,847.4],['云南',31.58,816.7],['天津',82.69,679.6],['上海',93,122]]:[['贵州·标签871%',33.3,870],['吉林·标签847%',32,750],['云南·标签817%',33.7,720],['天津',60,800],['上海',73,250]];let svg='';const px=x=>75+x*8,py=y=>283-y/900*250;for(let x=0;x<=100;x+=20)svg+=`<line class="grid" x1="${px(x)}" y1="30" x2="${px(x)}" y2="283"/><text x="${px(x)}" y="306" font-size="13" text-anchor="middle">${x}%</text>`;for(let y=0;y<=900;y+=200)svg+=`<line class="grid" x1="75" y1="${py(y)}" x2="875" y2="${py(y)}"/><text x="60" y="${py(y)+4}" font-size="13" text-anchor="end">${y}%</text>`;const threshold=CHECKED_VIEW?[40,700]:[50,661];svg+=`<rect x="75" y="33" width="${threshold[0]*8}" height="${py(threshold[1])-33}" fill="#d73e6040"/><line x1="75" y1="${py(threshold[1])}" x2="875" y2="${py(threshold[1])}" stroke="#c57a77" stroke-dasharray="5 5"/><text x="85" y="19" font-size="13">${CHECKED_VIEW?'按口述筛选：自给率&lt;40%、债务比&gt;700%':'原图文字筛选：自给率&lt;50%、债务比&gt;661%'}</text>`;points.forEach((p,i)=>{let x=px(p[1]),y=py(p[2]);svg+=`<circle cx="${x}" cy="${y}" r="7" fill="${i===4?'#61bd86':'#df9264'}"><title>${esc(p[0])}：${p[1]}%，${p[2]}%</title></circle><text x="${x+(i<3?20:-10)}" y="${y+(i<3?(i-1)*17:24)}" text-anchor="${i<3?'start':'end'}" font-size="14">${esc(p[0])}</text>`;});return F(`<svg class="deck-chart" viewBox="0 0 920 330" role="img" aria-label="原图位置与片内数值的散点对照">${svg}</svg>`,1)+`<div class="deck-subnote">${CHECKED_VIEW?'只绘本片给出足够数值的点；吉林33%来自原图取整标签。非底稿认证。':'原位置为读图近似；标签与坐标存在偏差。未给出的省级点不补造。'}</div>`;}

function fragments(){stage.querySelectorAll('.fragment').forEach(el=>{const order=Number(el.dataset.order)||1;el.style.setProperty('--delay',state.stepMode?'0ms':`${(order-1)*320}ms`);el.classList.toggle('revealed',!state.stepMode||order<=state.step);});$('step-next').hidden=!state.stepMode;$('step-next').textContent=state.step>=state.maxStep?'本页已展开':`展开一步 ${state.step}/${state.maxStep}`;$('step-next').disabled=state.step>=state.maxStep;$('step-mode').setAttribute('aria-pressed',String(state.stepMode));animateNumbers();}
function renderTranscript(s){$('subtitle-title').textContent=s.title;$('subtitle-range').textContent=`${mmss(s.start)}—${mmss(s.end)}`;$('subtitle-page').textContent=`第 ${state.index+1} 页 · ${s.phaseName}`;$('subtitle-body').innerHTML=s.cues.length?s.cues.map((c,i)=>`<tr data-segment="${i}" tabindex="0" aria-label="从${mmss(c.start)}播放原声"><td>${mmss(c.start)}</td><td>${esc(c.text)}</td></tr>`).join(''):`<tr><td>—</td><td>${esc(s.empty_reason||'本页口播请结合前后页。')}</td></tr>`;$('subtitle-scroll').scrollTop=0;state.activeRow=-1;}
function renderSlide(index,{seek=true,transition=true}={}){index=Math.max(0,Math.min(DECK.slides.length-1,index));const s=DECK.slides[index];if(!comparisonFor(s))CHECKED_VIEW=false;if(transition&&!reduced&&stage.innerHTML){host.querySelectorAll('.outgoing').forEach(n=>n.remove());const old=stage.cloneNode(true);old.removeAttribute('id');old.classList.add('outgoing','freeze');old.setAttribute('aria-hidden','true');old.style.pointerEvents='none';host.append(old);old.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out'}).finished.then(()=>old.remove()).catch(()=>old.remove());}
state.index=index;state.step=1;state.virtualTime=s.start;stage.innerHTML=canvasHTML(s,index);stage.setAttribute('aria-label',`第${index+1}张幻灯片：${s.title}，${s.phaseName}`);state.maxStep=Math.max(...[...stage.querySelectorAll('[data-order]')].map(n=>Number(n.dataset.order)),1);
$('page-select').value=String(index);$('page-count').innerHTML=`${String(index+1).padStart(2,'0')} <span>/ ${DECK.slides.length}</span>`;$('previous').disabled=index===0;$('next').disabled=index===DECK.slides.length-1;$('slide-range').value=index;$('slide-range').style.setProperty('--fill',`${index/(DECK.slides.length-1)*100}%`);$('phase-name').textContent=s.phaseName;$('source-range').textContent=`原视频 ${mmss(s.start)}—${mmss(s.end)}`;
renderTranscript(s);renderAudit(s);renderComparison(s);resize();requestAnimationFrame(fragments);if(seek){try{audio.currentTime=s.start;}catch{}if(state.auto)state.clock=performance.now();}try{history.replaceState(null,'',`#slide=${index+1}`);}catch{}if(transition&&!reduced)stage.animate([{opacity:.15},{opacity:1}],{duration:330,easing:'ease-out'});highlight(s.start);}
function highlight(time){const cues=DECK.slides[state.index].cues;if(!cues.length)return;let i=cues.findIndex(c=>time>=c.start&&time<c.end);if(i<0){i=0;for(let j=0;j<cues.length;j++)if(time>=cues[j].start)i=j;}if(i===state.activeRow)return;state.activeRow=i;const rows=$('subtitle-body').querySelectorAll('tr');rows.forEach((r,j)=>r.classList.toggle('active',j===i));const row=rows[i],scroller=$('subtitle-scroll');if(row){const top=row.offsetTop;const header=30;if(top<scroller.scrollTop+header||top+row.offsetHeight>scroller.scrollTop+scroller.clientHeight)scroller.scrollTo({top:Math.max(0,top-header-12),behavior:reduced?'auto':'smooth'});}}
function updateAudioUI(){const playing=!audio.paused;$('audio-toggle').disabled=!narrationAvailable;$('audio-toggle').setAttribute('aria-label',narrationAvailable?'播放或暂停原视频音频':'原声仅本地提供，可通过原视频链接收听');$('audio-toggle').setAttribute('aria-pressed',String(playing));$('audio-toggle').innerHTML=narrationAvailable?`${uiIcon(playing?'pause':'play')}<span>${playing?'暂停原声':'播放原声'}</span>`:`${uiIcon('play')}<span>原声仅本地提供</span>`;$('audio-toggle').title=narrationAvailable?'播放或暂停原声':'可通过原视频链接收听讲解';$('mode-dot').classList.toggle('playing',playing||state.auto);$('playback-label').textContent=playing?'原声跟随':state.auto?'自动演示':'自由翻页';$('auto-toggle').setAttribute('aria-pressed',String(state.auto));$('auto-toggle').textContent=state.auto?'暂停演示':'自动演示';}
async function playAt(time){if(!narrationAvailable){notify('原声仅本地提供，可通过上方原视频链接收听；仍可自由翻页或自动演示。');return;}state.auto=false;try{audio.currentTime=time;await audio.play();updateAudioUI();}catch(e){notify(audio.dataset.publicAudio==='true'?'原声暂时无法播放，请稍后重试或通过原视频链接收听；仍可自由翻页。':'原声暂时无法播放，请确认音频文件与网页在同一文件夹；仍可自由翻页。');updateAudioUI();}}
function uiIcon(name){const paths={play:'<path d="m6 3 10 7-10 7z"/>',pause:'<path d="M7 3v14m6-14v14"/>',left:'<path d="m12 4-6 6 6 6"/>',right:'<path d="m8 4 6 6-6 6"/>',grid:'<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>',full:'<path d="M3 7V3h4m6 0h4v4M3 13v4h4m6 0h4v-4"/>',replay:'<path d="M4 8a7 7 0 1 1 0 6M4 3v5h5"/>',close:'<path d="m5 5 10 10M15 5 5 15"/>'};return `<svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true">${paths[name]||''}</svg>`;}
$('page-select').innerHTML=DECK.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)} · ${esc(s.phaseName)}</option>`).join('');$('slide-range').max=DECK.slides.length-1;$('previous').innerHTML=uiIcon('left');$('next').innerHTML=uiIcon('right');$('gallery-open').innerHTML=uiIcon('grid')+'全部页面';$('fullscreen').innerHTML=uiIcon('full')+'<span>全屏</span>';$('replay').innerHTML=uiIcon('replay')+'重播动效';$('gallery-close').innerHTML=uiIcon('close');
$('page-select').addEventListener('change',e=>renderSlide(Number(e.target.value)));$('slide-range').addEventListener('input',e=>renderSlide(Number(e.target.value)));$('previous').onclick=()=>renderSlide(state.index-1);$('next').onclick=()=>renderSlide(state.index+1);$('replay').onclick=()=>{stage.innerHTML=canvasHTML(DECK.slides[state.index],state.index);state.step=1;requestAnimationFrame(fragments);};$('step-mode').onclick=()=>{state.stepMode=!state.stepMode;state.step=1;fragments();};$('step-next').onclick=()=>{if(state.step<state.maxStep){state.step++;fragments();}};
$('audio-toggle').onclick=async()=>{if(!audio.paused){audio.pause();updateAudioUI();return;}const s=DECK.slides[state.index];await playAt(audio.currentTime>=s.start&&audio.currentTime<s.end?audio.currentTime:s.start);};audio.addEventListener('play',updateAudioUI);audio.addEventListener('pause',updateAudioUI);audio.addEventListener('ended',updateAudioUI);audio.addEventListener('seeked',()=>{const i=slideAt(audio.currentTime);if(i!==state.index)renderSlide(i,{seek:false});highlight(audio.currentTime);});
$('auto-toggle').onclick=()=>{if(!audio.paused)audio.pause();state.auto=!state.auto;state.virtualTime=DECK.slides[state.index].start;state.clock=performance.now();updateAudioUI();};
function cueAction(row){if(!row)return;const cue=DECK.slides[state.index].cues[Number(row.dataset.segment)];if(cue)playAt(cue.start);}$('subtitle-body').addEventListener('click',e=>cueAction(e.target.closest('[data-segment]')));$('subtitle-body').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cueAction(e.target.closest('[data-segment]'));}});
$('copy-cues').onclick=async()=>{const s=DECK.slides[state.index];const content=`${s.title}\n${s.phaseName}\n原视频 ${mmss(s.start)}—${mmss(s.end)}\n\n${s.cues.map(c=>c.text).join('')}`;try{await navigator.clipboard.writeText(content);}catch{const ta=document.createElement('textarea');ta.value=content;ta.style.position='fixed';ta.style.opacity=0;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();}notify('已复制当前页讲稿');};
function galleryCanvas(s,i){const previous=CHECKED_VIEW;try{if(!comparisonFor(s))CHECKED_VIEW=false;return canvasHTML(s,i);}finally{CHECKED_VIEW=previous;}}
function buildGallery(query=''){
 query=query.trim().toLowerCase();
 const matches=DECK.slides.map((s,i)=>({s,i,c:comparisonFor(s)})).filter(({s,c})=>(!GALLERY_DIFFS||c)&&(s.title+' '+s.phaseName+' '+s.cues.map(c=>c.text).join('')+' '+(c?c.summary+' '+c.original+' '+c.checked:'')).toLowerCase().includes(query));
 $('gallery-grid').innerHTML=matches.length?matches.map(({s,i,c})=>`<button class="gallery-card ${i===state.index?'selected':''}" data-page="${i}" aria-label="跳转到第${i+1}页 ${esc(s.title)}"><div class="mini"><div class="canvas ${s.theme}">${galleryCanvas(s,i)}</div></div><div class="gallery-card-footer"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.title)}<small>${esc(s.phaseName)} · ${s.timeLabel}</small>${c?`<span class="comparison-badge">${esc(c.label)}</span><small class="gallery-difference">${esc(c.summary)}</small>`:''}</div></button>`).join(''):'<div class="empty-gallery">没有匹配的页面</div>';
 $('gallery-count').textContent=`${matches.length} / ${DECK.slides.length} 页${GALLERY_DIFFS?' · 仅可对照的页':''}`;requestAnimationFrame(resize);
}
function gallery(onlyDifferences=false){GALLERY_DIFFS=onlyDifferences;$('gallery-differences').checked=GALLERY_DIFFS;$('gallery-title').textContent=GALLERY_DIFFS?'选择一处校核对照':'选择一张幻灯片';buildGallery();$('gallery-search').value='';$('gallery').showModal();requestAnimationFrame(()=>{resize();$('gallery-search').focus();});}
$('gallery-open').onclick=()=>gallery(false);$('gallery-close').onclick=()=>$('gallery').close();$('gallery-search').addEventListener('input',e=>buildGallery(e.target.value));$('gallery-differences').onchange=e=>{GALLERY_DIFFS=e.target.checked;$('gallery-title').textContent=GALLERY_DIFFS?'选择一处校核对照':'选择一张幻灯片';buildGallery($('gallery-search').value);};
$('gallery-grid').addEventListener('click',e=>{const target=e.target.closest('[data-page]');if(target){if(GALLERY_DIFFS)CHECKED_VIEW=true;renderSlide(Number(target.dataset.page));$('gallery').close();}});$('gallery').addEventListener('click',e=>{if(e.target===$('gallery')){const r=$('gallery').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('gallery').close();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('presentation').requestFullscreen();}catch{notify('当前浏览器不支持全屏，可以使用浏览器的全屏模式。');}};document.addEventListener('fullscreenchange',()=>requestAnimationFrame(resize));
document.addEventListener('keydown',e=>{if($('gallery').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||(e.key===' '&&e.target.closest('button')))return;if(e.key==='ArrowRight'){e.preventDefault();renderSlide(state.index+1);}else if(e.key==='ArrowLeft'){e.preventDefault();renderSlide(state.index-1);}else if(e.key===' '){e.preventDefault();if(state.stepMode&&state.step<state.maxStep){state.step++;fragments();}else renderSlide(state.index+1);}else if(e.key==='Home'){e.preventDefault();renderSlide(0);}else if(e.key==='End'){e.preventDefault();renderSlide(DECK.slides.length-1);}else if(e.key.toLowerCase()==='r')$('replay').click();else if(e.key.toLowerCase()==='g')gallery();});
window.addEventListener('hashchange',()=>{const i=Number(new URLSearchParams(location.hash.slice(1)).get('slide'))-1;if(Number.isInteger(i)&&i>=0&&i<DECK.slides.length&&i!==state.index)renderSlide(i);});
let lastUpdate=0;function tick(now){if(now-lastUpdate>120){let t=null;if(!audio.paused)t=audio.currentTime;else if(state.auto){state.virtualTime+=(now-state.clock)/1000;state.clock=now;t=state.virtualTime;if(t>=DECK.duration){state.auto=false;updateAudioUI();t=DECK.duration-.02;}}if(t!==null){const i=slideAt(t);if(i!==state.index){renderSlide(i,{seek:false});state.virtualTime=t;state.clock=now;}highlight(t);$('play-time').textContent=`${mmss(t)} / ${mmss(DECK.duration)}`;}lastUpdate=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
const initial=Number(new URLSearchParams(location.hash.slice(1)).get('slide'))-1;renderSlide(Number.isInteger(initial)&&initial>=0&&initial<DECK.slides.length?initial:0,{transition:false});updateAudioUI();

function pageAuditIds(s){return [...new Set([...s.auditIds,...(comparisonFor(s)?.auditIds??[])])];}
function renderComparison(s){
 const c=comparisonFor(s),available=DECK.slides.filter(comparisonFor),ids=pageAuditIds(s),button=$('checked-view');
 button.disabled=!c;button.setAttribute('aria-pressed',String(CHECKED_VIEW));button.textContent=c?(CHECKED_VIEW?'返回原视频重绘':c.kind==='source'?'查看原文对照':'查看本页差异'):'本页无画面差异';button.title=c?c.summary:'当前页没有另一套校核画面；审计说明可从右侧查看。';
 $('comparison-panel').classList.toggle('comparing',CHECKED_VIEW);$('comparison-panel').dataset.kind=c?.kind??'none';
 $('comparison-status').textContent=c?`${c.label} · ${CHECKED_VIEW?'正在查看校核画面':'当前为原视频重绘'}`:ids.length?'本页有审计说明，画面保留':'本页没有图形或文案差异';
 $('comparison-summary').textContent=c?c.summary:'本页没有另一套校核画面，切换不会增加信息。画面保留不代表所有内容已核验无误；具体依据和资料缺口见审计。';
 $('comparison-details').hidden=!c;$('comparison-original').textContent=c?.original??'';$('comparison-checked').textContent=c?.checked??'';
 $('comparison-directory').textContent=`可对照的页 ${available.length}/${DECK.slides.length}`;$('comparison-next').disabled=available.length===0;$('comparison-directory').disabled=available.length===0;$('comparison-audit').hidden=ids.length===0;
}
function renderAudit(s){
 const ids=pageAuditIds(s),findings=DECK.audit.findings.filter(c=>AUDIT_ALL||ids.includes(c.id));
 const names={issue:'内部不一致',limited:'证据／范围限制',inference:'推演与表述边界',pass:'核验一致（限定范围）'};
 document.getElementById('audit-scroll').innerHTML=`<div class="case-note">${esc(DECK.audit.summary)}。校核对照不会修改原视频讲稿。</div><button class="audit-all" id="all-audits">${AUDIT_ALL?'仅看当前页审计':'查看全片审计报告'} · ${DECK.audit.findings.length}项</button>`+findings.map(c=>`<article class="audit-card"><span class="result ${c.status}">${c.id} · ${names[c.status]}</span><h3>${esc(c.title)}</h3><p><b>原表述：</b>${esc(c.claim)}</p><p>${esc(c.evidence)}</p>${c.calculation?`<div class="math">${esc(c.calculation)}</div>`:''}${c.scope?`<p class="small-label">${esc(c.scope)}</p>`:''}<p><a href="${DECK.source}?t=${c.times[0]}" target="_blank" rel="noopener">原视频 ${c.times[0]}秒 ↗</a>　<button class="audit-jump" data-time="${c.times[0]}">查看对应页</button></p></article>`).join('')+(findings.length?'':'<div class="case-note">当前页没有单独列出的审计项。可查看全片报告或来源清单。</div>');
 document.getElementById('all-audits').onclick=()=>{AUDIT_ALL=!AUDIT_ALL;renderAudit(DECK.slides[state.index]);};
 document.querySelectorAll('.audit-jump').forEach(b=>b.onclick=()=>renderSlide(slideAt(Number(b.dataset.time))));
 document.getElementById('sources-scroll').innerHTML='<div class="case-note">'+esc(DECK.audit.summary)+'</div>'+DECK.audit.sources.map(s=>`<div class="source-entry"><b>${s.id} · ${esc(s.title)}</b><small>${esc(s.date??'')} ${esc(s.issue??'')} · ${esc(s.publisher??'')}</small><small>${esc(s.status)}</small>${(s.excerpts??[]).map(e=>`<p><b>${esc(e.location)}</b><br>“${esc(e.text)}”</p>`).join('')}${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">查看原始出处 ↗</a>`:'<small>非公开资料，无网页发布附件。</small>'}</div>`).join('');
 const cls=DECK.slides[state.index].theme;document.getElementById('canvas').className='canvas '+cls;
}
document.querySelectorAll('.audit-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.audit-tabs button').forEach(n=>n.classList.toggle('selected',n===b));document.getElementById('subtitle-scroll').hidden=b.dataset.panel!=='transcript';document.getElementById('audit-scroll').hidden=b.dataset.panel!=='audit';document.getElementById('sources-scroll').hidden=b.dataset.panel!=='sources';});
document.getElementById('checked-view').onclick=()=>{const s=DECK.slides[state.index];if(!comparisonFor(s))return;CHECKED_VIEW=!CHECKED_VIEW;stage.innerHTML=canvasHTML(s,state.index);state.step=1;state.maxStep=Math.max(...[...stage.querySelectorAll('[data-order]')].map(n=>Number(n.dataset.order)),1);fragments();renderComparison(s);};
document.getElementById('comparison-directory').onclick=()=>gallery(true);
document.getElementById('comparison-next').onclick=()=>{const indexes=DECK.slides.map((s,i)=>comparisonFor(s)?i:-1).filter(i=>i>=0);if(!indexes.length)return;const next=indexes.find(i=>i>state.index)??indexes[0];CHECKED_VIEW=true;renderSlide(next);};
document.getElementById('comparison-audit').onclick=()=>{AUDIT_ALL=false;renderAudit(DECK.slides[state.index]);document.querySelector('[data-panel="audit"]').click();};
</script>
