,"timeLabel":"00:48—01:00","cues":[{"start":48.5,"end":51.02,"text":"对，那有哪些省份是特别值得关注的？"},{"start":51.3,"end":54.06,"text":"然后他们各自的异常点都体现在什么地方？"},{"start":54.32,"end":56.4,"text":"有5个省份是非常有代表性的。"}],"auditIds":["P05"],"narration_free":false,"empty_reason":""},{"id":6,"start":60,"end":84,"title":"28省财政压力排序","phaseName":"省份排序 · 01:00","scene":"ranking","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:00—01:24","cues":[{"start":56.74,"end":66.76,"text":"比如说天津，他的自给率是全国第三，82.69%，但是他的综合得分却已经到了橙区62.8分。"},{"start":67.26,"end":71.2,"text":"这就说明他虽然自己能挣，但是整体的压力依然很大。"},{"start":71.42,"end":75.16,"text":"哦，自给率这么高，还能进橙区，确实有点意外。"},{"start":75.16,"end":81.48,"text":"是啊，然后另外就是吉林，他是一年上升了12.3分，是全国恶化最快的。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":7,"start":84,"end":96,"title":"一年间的分值变化","phaseName":"变化类型 · 01:24","scene":"change","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:24—01:36","cues":[{"start":81.84,"end":87.32,"text":"山西呢是刚好相反，一年下降12.3分，是改善最明显的。"},{"start":87.76,"end":91.44,"text":"广东的话，他的债务余额已经高达4.15万亿元，"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":8,"start":96,"end":108,"title":"江苏：财力强省的流动性陷阱","phaseName":"江苏 · 01:36","scene":"jiangsu","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:36—01:48","cues":[{"start":92.14,"end":102.94,"text":"但是他的限额空间只剩下0.86%，还有江苏，就是他的D板块得分是96.7分，但是A板块只有27.4分，"},{"start":102.94,"end":104.52,"text":"就他内部的分化特别严重。"},{"start":104.78,"end":110.68,"text":"对，我想知道就是这个地方财政危机指数，它具体是由哪几个板块构成的？"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":9,"start":108,"end":120,"title":"01 · 怎样衡量财政压力","phaseName":"章节分隔 · 01:48","scene":"section","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"01:48—02:00","cues":[{"start":110.98,"end":113.08,"text":"然后这几个板块背后的逻辑是什么？"},{"start":113.08,"end":117.24,"text":"这个指数，他其实是把政府的预算分成了四本账。"},{"start":117.62,"end":120.94,"text":"然后这四本账又进一步的细化成了四个板块。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":10,"start":120,"end":132,"title":"四个板块，十二项指标","phaseName":"指标构成 · 02:00","scene":"model","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:00—02:12","cues":[{"start":121.48,"end":130.52,"text":"第一个板块是财力造血，就是看你这个地方自己能挣多少钱，他的权重是35%，第二个板块是收支平衡，"}],"auditIds":["L07","L16"],"narration_free":false,"empty_reason":""},{"id":11,"start":132,"end":156,"title":"四本账：四个风险板块","phaseName":"权重 · 02:12","scene":"weights","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:12—02:36","cues":[{"start":130.98,"end":141.34,"text":"这个占30%，然后第三个是刚性负债挤压，这个是25%，最后一个板块是流动性与风险暴露，这个是10%。"},{"start":141.9,"end":145.36,"text":"每一个板块都抓住了财政运行的一个关键环节。"},{"start":145.62,"end":156.82,"text":"没错，而且这12项核心指标，每一项都会先按照统一的标准去进行打分，就是0到100分，然后再根据子权重合成板块分，"}],"auditIds":["L07","L10"],"narration_free":false,"empty_reason":""},{"id":12,"start":156,"end":168,"title":"分级与三条禁忌","phaseName":"使用边界 · 02:36","scene":"boundary","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:36—02:48","cues":[{"start":157.18,"end":160.32,"text":"最后加权得到综合分，就非常的细致。"},{"start":160.62,"end":165.2,"text":"好的，这28个省份整体的财政压力得分是怎么分布的？"}],"auditIds":["L10","P05"],"narration_free":false,"empty_reason":""},{"id":13,"start":168,"end":180,"title":"均值58.0：分布比水平更重要","phaseName":"总体分布 · 02:48","scene":"distribution","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"02:48—03:00","cues":[{"start":165.2,"end":172.36,"text":"这28个省份的综合分，它的均值是58.0，中位数是58.4，"},{"start":173.1,"end":178.7,"text":"然后极差是46.1，就是最高分和最低分之间差了46.1分。"}],"auditIds":["P01"],"narration_free":false,"empty_reason":""},{"id":14,"start":180,"end":216,"title":"28省财政压力排序","phaseName":"省份排序 · 03:00","scene":"ranking","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:00—03:36","cues":[{"start":178.7,"end":189.22,"text":"具体的分布是这样的，只有上海是独自在绿区，它的得分是31.4，然后黄区是有15个省份，"},{"start":189.64,"end":193.18,"text":"从北京的44.4到河南的58.8。"},{"start":193.98,"end":206.2,"text":"橙区是有12个省份，从山西的60.5到江西的77.5，红区是没有的，所以整体来看，大部分省份的得分都是集中在50分以上的，"},{"start":206.48,"end":208.98,"text":"就说明财政压力是一个比较普遍的现象。"},{"start":209.28,"end":214.34,"text":"我还有个问题，就是在负债端这4个板块的得分，具体有哪些差异？"}],"auditIds":["P01"],"narration_free":false,"empty_reason":""},{"id":15,"start":216,"end":240,"title":"四个板块里，只有负债端全面落在橙区","phaseName":"板块均值 · 03:36","scene":"means","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"03:36—04:00","cues":[{"start":214.34,"end":222.58,"text":"这4个板块的差异还是挺大的，财力造血板块的平均分是37.3，收支平衡板块是61.5，"},{"start":223.36,"end":226.12,"text":"刚性负债挤压板块是83.9，"},{"start":226.8,"end":229.86,"text":"流动性与风险暴露板块是57.8。"},{"start":230.5,"end":242.7,"text":"其中，刚性负债挤压这个板块不仅均值最高，而且它的标准差是最小的，只有10.6，就说明所有省份在这个板块上面都普遍承受着比较大的压力。"}],"auditIds":["L05","L06","L07","L10","L18"],"narration_free":false,"empty_reason":"","comparison":{"kind":"conditional","label":"条件演算","summary":"显示等人数、无缺项假设下的均值；不能据此认证或否定原模型。","original":"原图D均值57.8；标题称负债端“全面橙区”。","checked":"若两组各14省且无缺项，D均值为58.65。缺项口径未披露，57.8仍可能成立；C83.9按阈值属红区，不能推出各省全面橙区。","auditIds":["L06","L07","L10"]}},{"id":16,"start":240,"end":276,"title":"财政健康仪表盘：板块分布","phaseName":"板块均值 · 04:00","scene":"means","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"04:00—04:36","cues":[{"start":242.7,"end":253.9,"text":"也就是说几乎没有哪个地方能够在负债这一块过得特别轻松，是的，你看有25个省份，在刚性负债挤压这个板块的得分都是高于70的。"},{"start":254.62,"end":257.36,"text":"然后河北是最高的93.7分，"},{"start":258.04,"end":267.62,"text":"吉林和山东是并列第二92.1分，广西和江西是90.2分，就连负担最轻的上海也有46.3分。"},{"start":268.06,"end":280.58,"text":"而且从总量上面来看的话，这28个省份的显性债务的余额总共是高达53.99万亿元，但是法定的限额是57万亿元。"}],"auditIds":["L10"],"narration_free":false,"empty_reason":"","comparison":{"kind":"conditional","label":"条件演算","summary":"显示等人数、无缺项假设下的均值；不能据此认证或否定原模型。","original":"原图D均值57.8；标题称负债端“全面橙区”。","checked":"若两组各14省且无缺项，D均值为58.65。缺项口径未披露，57.8仍可能成立；C83.9按阈值属红区，不能推出各省全面橙区。","auditIds":["L06","L07","L10"]}},{"id":17,"start":276,"end":300,"title":"债务限额余量与九省阈值","phaseName":"限额余量 · 04:36","scene":"headroom","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"04:36—05:00","cues":[{"start":280.58,"end":290.56,"text":"也就是说全国的平均剩余额度只剩5.4%了，有9个省份甚至都不到5%，广东更是低至0.86%。"},{"start":290.88,"end":299.02,"text":"所以额度一旦吃紧的话，地方就只能靠压支出挪资金或者让平台去借新还旧，没有什么别的路可以走。"}],"auditIds":["L12","L13","P03","P04"],"narration_free":false,"empty_reason":""},{"id":18,"start":300,"end":312,"title":"限额之墙：扩张约束","phaseName":"限额余量 · 05:00","scene":"headroom","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:00—05:12","cues":[{"start":299.02,"end":307.98,"text":"对，我们接下来要讲的高财力组和低财力组的横向的对比，我也特别想知道说分组到底是怎么分的，为什么要这么分？"}],"auditIds":["L12"],"narration_free":false,"empty_reason":""},{"id":19,"start":312,"end":324,"title":"为什么必须分组看：体量不等于能力","phaseName":"分组口径 · 05:12","scene":"grouping","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:12—05:24","cues":[{"start":308.2,"end":319.7,"text":"其实分组的目的是为了把财力的水平和压力的水平拆开来看，综合分它其实是收入、支出、债务、流动性这些东西的一个综合体。"},{"start":319.7,"end":327.92,"text":"你光看分数你是没有办法知道，到底是因为你的收入弱，还是说你的债务的压力大，导致你这个分数有高低。"}],"auditIds":["L13"],"narration_free":false,"empty_reason":""},{"id":20,"start":324,"end":336,"title":"四本账：四个风险板块","phaseName":"权重 · 05:24","scene":"weights","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:24—05:36","cues":[{"start":328.44,"end":330.78,"text":"我们通过按人均财力来分组的话，"},{"start":331.4,"end":333.8,"text":"就可以把同一个量级的省份放在一起，"},{"start":334.44,"end":337.12,"text":"然后去观察他们内部的差异到底是怎么来的。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":21,"start":336,"end":348,"title":"为什么必须分组看：体量不等于能力","phaseName":"分组口径 · 05:36","scene":"grouping","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:36—05:48","cues":[{"start":337.32,"end":343.24,"text":"高财力组的这些省份在财政收支和债务结构上面具体有哪些明显的分化特征？"},{"start":343.54,"end":348.14,"text":"这个高财力组的话，它的综合分的均值是54.0。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":22,"start":348,"end":360,"title":"高财力组：14省里，只有上海在绿区","phaseName":"高财力组表 · 05:48","scene":"high","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"05:48—06:00","cues":[{"start":348.90000000000003,"end":352.86,"text":"然后最高分和最低分之间相差38.4分。"},{"start":353.12,"end":363.6,"text":"它的分化主要是有两种，一种是像天津、浙江、广东这几个地方，就是自给率很高，但是它的债务收入比也非常的高。"}],"auditIds":["L07","P01","P02"],"narration_free":false,"empty_reason":""},{"id":23,"start":360,"end":384,"title":"高财力组的内部差异","phaseName":"高组结构 · 06:00","scene":"high-story","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:00—06:24","cues":[{"start":364.16,"end":371.68,"text":"它虽然说日常的收支是很健康的，但是它的存量的债务压力和它的举债的空间已经非常紧张了。"},{"start":371.92,"end":375.54,"text":"所以说高财力并不一定意味着你就没有结构性的风险。"},{"start":375.97999999999996,"end":379.76,"text":"对啊，那低财力组的短板主要是集中在哪些板块？"},{"start":380.24,"end":382.1,"text":"然后内部的分化又体现在哪里？"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":24,"start":384,"end":396,"title":"低财力组：橙区9省，压力最集中","phaseName":"低财力组表 · 06:24","scene":"low","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:24—06:36","cues":[{"start":382.34,"end":387.0,"text":"低财力组的话，它的综合分的均值是62.1。"},{"start":387.9,"end":390.7,"text":"然后组内的差异是21.3分。"},{"start":391.9,"end":395.2,"text":"它的最明显的短板是在收支平衡这个板块。"}],"auditIds":["L03","L14","P01","P02"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"数量更正","summary":"标题的橙区数量从9省更正为7省；表内分数不变。","original":"标题写“橙区9省”。","checked":"按本片14省表逐项计数，橙区为7省。","auditIds":["L03"]}},{"id":25,"start":396,"end":408,"title":"高、低财力组的结构差异","phaseName":"板块对照 · 06:36","scene":"comparison","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:36—06:48","cues":[{"start":395.2,"end":400.92,"text":"它的均值只有68.9，比高财力组要低了将近15分。"},{"start":401.56,"end":408.88,"text":"而且自给率低于50%的省份有9个，最低的甘肃甚至只有23.26%。"}],"auditIds":["L06"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"组间差说明","summary":"柱值不变；明确最大差为B14.9分，D仅5.1分。","original":"原副标题称“A、C差距最大”，口播将D差距说成15分以上。","checked":"按显示值相减：A3.4、B14.9、C9.0、D5.1；最大差是B。","auditIds":["L04","L05"]}},{"id":26,"start":408,"end":420,"title":"低财力组：收入、负债与融资三条线","phaseName":"低组结构 · 06:48","scene":"low-story","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"06:48—07:00","cues":[{"start":409.04,"end":412.84,"text":"看来收支的缺口确实是低财力省份的一个通病。"},{"start":413.3,"end":421.4,"text":"是，然后除了这个之外，财力造血和刚性负债挤压，这两个板块的得分也都非常的高。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":27,"start":420,"end":432,"title":"同一板块，两组相差15分","phaseName":"板块对照 · 07:00","scene":"comparison","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:00—07:12","cues":[{"start":421.66,"end":425.12,"text":"就负债和流动性的压力其实也已经顶到天花板了。"},{"start":425.12,"end":433.04,"text":"那组内的分化主要是江西，它是因为负债和收入进度都拖后腿，所以它的分数就特别高。"}],"auditIds":["L04","L06","L07"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"组间差说明","summary":"柱值不变；明确最大差为B14.9分，D仅5.1分。","original":"原副标题称“A、C差距最大”，口播将D差距说成15分以上。","checked":"按显示值相减：A3.4、B14.9、C9.0、D5.1；最大差是B。","auditIds":["L04","L05"]}},{"id":28,"start":432,"end":444,"title":"低财力组：橙区9省，压力最集中","phaseName":"低财力组表 · 07:12","scene":"low","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:12—07:24","cues":[{"start":433.58,"end":439.16,"text":"然后湖北虽然说分数最低，但是河北其实它的这个限额空间是更小的。"},{"start":439.98,"end":443.28,"text":"就它的实际的压力比它的分数显示的还要更紧张。"}],"auditIds":["L03"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"数量更正","summary":"标题的橙区数量从9省更正为7省；表内分数不变。","original":"标题写“橙区9省”。","checked":"按本片14省表逐项计数，橙区为7省。","auditIds":["L03"]}},{"id":29,"start":444,"end":516,"title":"财力与压力：四板块对比","phaseName":"板块对照 · 07:24","scene":"comparison","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"07:24—08:36","cues":[{"start":443.54,"end":450.16,"text":"这么说的话，高财力组和低财力组在这四个板块上面的得分，具体有哪些关键的不同？"},{"start":450.16,"end":459.06,"text":"这个财力造血板块的话，高财力组是35.6分，低财力组是39.0分，就其实差距不大。"},{"start":459.54,"end":468.7,"text":"那真正拉开的是在收支平衡这个板块，高财力组是54.0分，但是低财力组就只有68.9分，"},{"start":469.42,"end":470.82,"text":"就差了将近15分。"},{"start":471.14,"end":475.1,"text":"这也是为什么低财力组的整体的压力分数会更高的主要原因。"},{"start":475.1,"end":480.42,"text":"所以说低财力省份的财政困境主要还是收支的缺口在作祟。"},{"start":480.6,"end":481.04,"text":"没错，没错。"},{"start":481.52,"end":483.64,"text":"然后到了这个刚性负债挤压这个板块，"},{"start":484.3,"end":485.72,"text":"两组的分数都很高。"},{"start":486.18,"end":492.94,"text":"就说明大家其实都被债务压的喘不过气，只不过高财力组是在平台的流动性上更吃紧一些。"},{"start":493.38,"end":501.66,"text":"就它的这个流动性与风险暴露板块是61.2，反而比低财力组的56.1还要高出5.1分。"},{"start":502.0,"end":505.4,"text":"就说明它的短板已经转移到了平台的流动性上面。"},{"start":505.64,"end":513.4,"text":"行，那我们来分析一下这个纵向的变化，就是这两组省份，他们的财政压力在过去一年当中的分化趋势。"}],"auditIds":[],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"组间差说明","summary":"柱值不变；明确最大差为B14.9分，D仅5.1分。","original":"原副标题称“A、C差距最大”，口播将D差距说成15分以上。","checked":"按显示值相减：A3.4、B14.9、C9.0、D5.1；最大差是B。","auditIds":["L04","L05"]}},{"id":30,"start":516,"end":528,"title":"低财力组：橙区9省，压力最集中","phaseName":"低财力组表 · 08:36","scene":"low","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"08:36—08:48","cues":[{"start":513.4,"end":523.96,"text":"如果我们去对比同口径的去年的数据的话，就会发现其实高财力组的这个平均分是从55.24降到了54.0。"},{"start":524.44,"end":529.0,"text":"但是低财力组呢是从60.79上升到了62.1。"}],"auditIds":["L03"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"数量更正","summary":"标题的橙区数量从9省更正为7省；表内分数不变。","original":"标题写“橙区9省”。","checked":"按本片14省表逐项计数，橙区为7省。","auditIds":["L03"]}},{"id":31,"start":528,"end":552,"title":"一年间：两组差距5.55到8.01","phaseName":"同比变化 · 08:48","scene":"trend","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"08:48—09:12","cues":[{"start":529.88,"end":534.64,"text":"就他们两组之间的差距是从5.55扩大到了8.01。"},{"start":535.22,"end":537.62,"text":"然后他们的标准差也是同步变大的。"},{"start":537.82,"end":542.0,"text":"看来不光是组与组之间拉开了，组内的差异也更加明显了。"},{"start":542.0,"end":546.62,"text":"对啊，就高财力组里面，重庆和上海能差38.4分。"},{"start":546.96,"end":550.52,"text":"低财力组里面，江西和河北也能差24.2分。"}],"auditIds":["L14","P02"],"narration_free":false,"empty_reason":""},{"id":32,"start":552,"end":564,"title":"低财力组：橙区9省，压力最集中","phaseName":"低财力组表 · 09:12","scene":"low","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"09:12—09:24","cues":[{"start":551.1,"end":555.6,"text":"就它的压力已经不是说以前那种大家都一样的压力，或者说区域性的压力。"},{"start":555.8,"end":559.04,"text":"它更多的是一些个体性的和结构性的风险在冒头。"},{"start":559.56,"end":561.72,"text":"所以你如果只看全国的平均数的话，"},{"start":562.46,"end":565.44,"text":"很容易就会低估了这种分化带来的潜在的隐患。"}],"auditIds":["L03","L14"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"数量更正","summary":"标题的橙区数量从9省更正为7省；表内分数不变。","original":"标题写“橙区9省”。","checked":"按本片14省表逐项计数，橙区为7省。","auditIds":["L03"]}},{"id":33,"start":564,"end":576,"title":"总分与结构：最终判断","phaseName":"结构判断 · 09:24","scene":"summary","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"09:24—09:36","cues":[{"start":565.68,"end":566.42,"text":"确实是这样。"},{"start":566.42,"end":574.04,"text":"那自给率和债务收入比这两个指标放在一起看的话，能反映出哪些省份的财政压力是最突出的。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":34,"start":576,"end":624,"title":"自给率与债务收入比","phaseName":"双指标分布 · 09:36","scene":"scatter","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"09:36—10:24","cues":[{"start":574.78,"end":577.32,"text":"如果把这两个指标画在一个散点图上面的话，"},{"start":578.08,"end":581.08,"text":"你就会发现最危险的区域是在左上角。"},{"start":581.5400000000001,"end":588.8,"text":"就是自给率低于40%，然后债务收入比高于700%的这个区间里面是最危险的。"},{"start":589.18,"end":591.54,"text":"那有五个省份是落在这个里面的。"},{"start":592.06,"end":595.96,"text":"贵州、甘肃、吉林、云南、广西。"},{"start":596.64,"end":609.94,"text":"他们的这个债务收入比都超过了760%，就远远高于全国的中位数537.7%，以及低财力组的平均值661.3%。"},{"start":609.94,"end":616.02,"text":"看来这几个省确实是财政的自我贡献能力很弱，然后债务的负担又极其沉重。"},{"start":616.16,"end":619.9,"text":"好的，那我们接下来就分析一下这个财政压力变动的原因嘛。"},{"start":620.26,"end":627.04,"text":"那首先我想问一下，山西和内蒙古，他们这一年在财政压力的改善上面有哪些相似的地方？"}],"auditIds":["L08","L09"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"坐标校核","summary":"用片内已给出的数值重新定位5个点，并说明筛选线的口径差异。","original":"吉林标签847%却画在约750%；云南标签817%却画在约720%。上海、天津的位置也与片内别页数值不符。","checked":"以片内数值定位吉林847.4%、云南816.7%等点；按口述的40%／700%画筛选线，和原图50%／661%区别标明。缺少数据的省份不补造。","auditIds":["L08","L09"]}},{"id":35,"start":624,"end":636,"title":"改善、恶化与被掩盖","phaseName":"变化类型 · 10:24","scene":"change","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"10:24—10:36","cues":[{"start":627.2,"end":629.14,"text":"这两个地方其实改善的都非常明显。"},{"start":629.46,"end":634.44,"text":"山西是下降了12.3分，内蒙古是下降了6.5分。"}],"auditIds":["L15"],"narration_free":false,"empty_reason":""},{"id":36,"start":636,"end":660,"title":"山西与内蒙古：虚假的复苏","phaseName":"山西与内蒙古 · 10:36","scene":"shanxi","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"10:36—11:00","cues":[{"start":634.44,"end":640.08,"text":"那他们两个的这个收入预算的进度都是超过了50%的。"},{"start":640.52,"end":643.56,"text":"然后支出的进度都是在43.7%。"},{"start":643.94,"end":648.9,"text":"就是他们都是收入端回补的非常快，然后支出是很克制的。"},{"start":649.2,"end":652.48,"text":"所以他们的这个A板块和B板块都是同步修复的。"},{"start":652.64,"end":657.3,"text":"那安徽和上海在财政压力改善上面，他们两个的方式有什么本质的不同？"},{"start":657.3,"end":659.6,"text":"安徽的话，它是一个低财力省份嘛。"}],"auditIds":["L15"],"narration_free":false,"empty_reason":"","comparison":{"kind":"qualification","label":"表述限定","summary":"分数不变；将“虚假复苏”的确定性标题改为需要证据支持的解释。","original":"标题将山西、内蒙古的改善称为“虚假的复苏”。","checked":"保留分值下降与存量压力，将这一因果定性标为待补证。","auditIds":["L15"]}},{"id":37,"start":660,"end":708,"title":"安徽与上海：不同改善机制","phaseName":"安徽与上海 · 11:00","scene":"shanghai","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"11:00—11:48","cues":[{"start":660.24,"end":665.3,"text":"它的综合分只比河北高，但是它的这个结构是非常均衡的。"},{"start":665.8,"end":668.28,"text":"就它的自给率是超过了50%的。"},{"start":668.8,"end":671.6,"text":"然后它的收入进度是快于支出的。"},{"start":672.12,"end":675.68,"text":"债务收入比也是明显低于同组的平均水平的。"},{"start":676.1,"end":680.1,"text":"所以它的这个A板块和B板块都是在组内非常领先的。"},{"start":680.56,"end":683.4,"text":"但是它的这个存量的债务压力依然很大。"},{"start":683.66,"end":685.76,"text":"所以它的C板块得分还是很高的。"},{"start":685.76,"end":688.58,"text":"所以安徽靠的是收支的均衡。"},{"start":688.68,"end":689.44,"text":"那上海呢？"},{"start":689.86,"end":691.96,"text":"上海的话是因为它的自给率非常高。"},{"start":692.44,"end":695.8,"text":"然后债务收入比很低，限额空间也非常充足。"},{"start":696.18,"end":698.12,"text":"所以它整体的负担是很轻的。"},{"start":698.48,"end":702.04,"text":"好，那我们现在要聊的是财政压力恶化的原因。"},{"start":702.44,"end":703.82,"text":"首先我想问一下吉林。"},{"start":704.22,"end":708.6,"text":"吉林为什么2026年财政压力突然之间全国恶化的最厉害？"}],"auditIds":["L09"],"narration_free":false,"empty_reason":""},{"id":38,"start":708,"end":720,"title":"收入进度掉队，债务已到顶","phaseName":"吉林 · 11:48","scene":"jilin","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"11:48—12:00","cues":[{"start":708.7,"end":709.06,"text":"吉林。"},{"start":709.36,"end":711.18,"text":"2026年恶化的确实很厉害。"},{"start":711.6,"end":715.46,"text":"它的这个综合分是一下子涨了12.3分。"},{"start":715.76,"end":723.78,"text":"那主要的原因就是因为它的这个收入的预算进度比2025年同期是下降了5.73个百分点。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":39,"start":720,"end":780,"title":"吉林：高基数与负债约束","phaseName":"吉林 · 12:00","scene":"jilin","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"12:00—13:00","cues":[{"start":724.4200000000001,"end":728.8,"text":"然后非税收入这块因为2025年的上半年有一个高基数。"},{"start":729.44,"end":732.08,"text":"就是它2025年上半年有一个集中的盘活。"},{"start":732.08,"end":735.42,"text":"所以导致2026年同比是大幅回落的。"},{"start":735.68,"end":739.78,"text":"那这个回落又刚好碰上了它的这个债务负担非常的沉重。"},{"start":740.02,"end":742.4,"text":"就是说它不光是收入掉下来了。"},{"start":742.72,"end":745.32,"text":"它的这个债务压力也已经顶到天花板了。"},{"start":745.4,"end":745.56,"text":"是的。"},{"start":745.56,"end":749.48,"text":"它的这个刚性负债挤压板块是92.1分。"},{"start":749.64,"end":751.24,"text":"在全国都是非常高的。"},{"start":751.66,"end":755.16,"text":"然后它的这个债务收入比是847.4%。"},{"start":755.68,"end":757.24,"text":"限额空间只剩下4%。"},{"start":758.12,"end":761.12,"text":"就它的这个显性债务是1.14万亿元。"},{"start":761.78,"end":765.5,"text":"但是它的这个本级收入也就1350亿元左右。"},{"start":766.1,"end":770.54,"text":"所以它这个收入一慢下来之后，它的这个缺口就只能靠压支出。"},{"start":770.84,"end":774.26,"text":"但是它的这个支出的进度已经压到了47.16%。"},{"start":774.62,"end":775.72,"text":"已经没有什么空间了。"},{"start":776.0,"end":778.12,"text":"所以它的这个压力就会一下子爆发出来。"},{"start":778.28,"end":779.1,"text":"原来是这样啊。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":40,"start":780,"end":792,"title":"天津：收入不弱，额度吃紧","phaseName":"天津 · 13:00","scene":"tianjin","the "但是他们的这个变化量其实是非常有限的。"},{"start":929.12,"end":937.56,"text":"那像广东和浙江这种财力这么强的省份，为什么在债务和额度这方面也会面临比较棘手的约束呢？"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":46,"start":936,"end":948,"title":"广东、浙江：分数尚可，压力犹存","phaseName":"广东与浙江 · 15:36","scene":"guangdong","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"15:36—15:48","cues":[{"start":937.56,"end":940.86,"text":"广东的话，它的这个综合分是50.6。"},{"start":941.24,"end":943.2,"text":"它是处于这个黄区的中间。"},{"start":943.5,"end":947.64,"text":"然后它的这个债务余额是4.15万亿元，全国第一。"}],"auditIds":["L12"],"narration_free":false,"empty_reason":""},{"id":47,"start":948,"end":996,"title":"广东、浙江：额度与收入的对照","phaseName":"广东与浙江 · 15:48","scene":"guangdong","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"15:48—16:36","cues":[{"start":948.02,"end":950.18,"text":"但是它的这个限额空间只剩下0."},{"start":950.8,"end":951.34,"text":"86%。"},{"start":951.9,"end":953.84,"text":"就几乎已经没有什么举债的余地了。"},{"start":954.16,"end":956.2,"text":"然后它的这个C板块是80分。"},{"start":956.66,"end":960.46,"text":"所以它的这个压力全部都集中在能不能继续借钱这一点上。"},{"start":961.1,"end":966.36,"text":"浙江的话，虽然说它的这个自给率是89.87%排全国第二。"},{"start":966.8,"end":971.14,"text":"然后它的收入进度是61.41%排全国第一。"},{"start":971.54,"end":973.96,"text":"但是它的这个C板块同样也是80分。"},{"start":974.36,"end":978.7,"text":"然后它的这个债务收入比是361.8%。"},{"start":979.2,"end":981.96,"text":"它的这个限额空间也只有4.08%。"},{"start":982.5,"end":987.06,"text":"就它虽然说财政收入很强，但是它的这个借债的规模也同样很大。"},{"start":987.62,"end":996.04,"text":"所以就是说这些强省它的这个表面的分数好看，其实主要是靠它的这个收入和平衡这两块在拉分。"}],"auditIds":["L12"],"narration_free":false,"empty_reason":""},{"id":48,"start":996,"end":1008,"title":"同样的总分，完全不同的病理","phaseName":"同样的总分，完全不同的病理 · 16:36","scene":"patients","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"16:36—16:48","cues":[{"start":996.62,"end":999.28,"text":"但是它的这个债务的压力其实一点都没有少。"},{"start":999.54,"end":999.84,"text":"没错，没错。"},{"start":1000.1,"end":1007.74,"text":"就高财力的省份，你从重庆的69.8分到上海的31.4分，它的这个内部的离散是非常大的。"}],"auditIds":["L11"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"分区更正","summary":"柱值不变；吉林B32属于绿区，不能称A/B/C全线危重。","original":"原图将吉林概括为“A/B/C全线危重”。","checked":"保留原分值及缺项；指出B32为绿区，分开说明各板块压力。","auditIds":["L11"]}},{"id":49,"start":1008,"end":1020,"title":"高财力组：14省里，只有上海在绿区","phaseName":"高财力组表 · 16:48","scene":"high","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"16:48—17:00","cues":[{"start":1008.3,"end":1014.68,"text":"然后它的这个C板块和额度空间这两项，其实直接决定了它未来还能不能够继续扩张。"},{"start":1015.12,"end":1019.8,"text":"所以你光看它的总分的话，是很容易去高估它的这个安全边际的。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":50,"start":1020,"end":1032,"title":"04 · 六条结论与数据边界","phaseName":"章节分隔 · 17:00","scene":"section","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"17:00—17:12","cues":[{"start":1019.98,"end":1023.3,"text":"好的，我们来总结一下这个分省的评估，"},{"start":1023.92,"end":1028.9,"text":"到底告诉了我们哪些关于地方财政压力的结构性特征和变化的主因。"},{"start":1029.16,"end":1034.22,"text":"其实我们通过对这28个省份的分析，可以得到6个比较关键的判断。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":51,"start":1032,"end":1056,"title":"结构性压力：六条判断","phaseName":"结构判断 · 17:12","scene":"summary","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"17:12—17:36","cues":[{"start":1034.22,"end":1038.92,"text":"第一个就是这个结构特征其实要比总量更重要。"},{"start":1039.3,"end":1043.38,"text":"就是你这个压力到底有多大，其实关键看你这个短板在哪里，"},{"start":1044.04,"end":1050.34,"text":"尤其是C板块和限额空间，这是几乎所有省份都绕不过去的一个共同的瓶颈。"},{"start":1050.9,"end":1059.06,"text":"所以就是说收支的节奏和融资的波动，要比你这个税基的变化更能解释今年的这个分数的起伏。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":52,"start":1056,"end":1068,"title":"同样的总分，完全不同的病理","phaseName":"同样的总分，完全不同的病理 · 17:36","scene":"patients","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"17:36—17:48","cues":[{"start":1059.14,"end":1059.6,"text":"对，没错。"},{"start":1060.12,"end":1066.32,"text":"然后第三个就是现在已经有9个省份的这个额度的余量都不足5%了。"}],"auditIds":["L11"],"narration_free":false,"empty_reason":"","comparison":{"kind":"correction","label":"分区更正","summary":"柱值不变；吉林B32属于绿区，不能称A/B/C全线危重。","original":"原图将吉林概括为“A/B/C全线危重”。","checked":"保留原分值及缺项；指出B32为绿区，分开说明各板块压力。","auditIds":["L11"]}},{"id":53,"start":1068,"end":1080,"title":"回看限额之墙","phaseName":"限额余量 · 17:48","scene":"headroom","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"17:48—18:00","cues":[{"start":1066.98,"end":1069.92,"text":"然后广东更是只有0.86%。"},{"start":1070.6,"end":1072.8,"text":"就它的这个扩张的空间已经基本没有了。"},{"start":1073.42,"end":1075.0,"text":"然后第四个是天津。"},{"start":1075.3,"end":1080.3,"text":"天津就是一个自给率很高，但是整体的风险依然很高的一个代表。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":54,"start":1080,"end":1092,"title":"回看天津：分母效应","phaseName":"天津 · 18:00","scene":"tianjin","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"18:00—18:12","cues":[{"start":1080.7199999999998,"end":1089.78,"text":"然后第五个就是这个平台的净融资的收紧和这个非标风险的爆发，总是先于这个公开市场的。"},{"start":1090.08,"end":1091.88,"text":"所以它是一个很好的领先指标。"}],"auditIds":["L17"],"narration_free":false,"empty_reason":"","comparison":{"kind":"qualification","label":"推断限定","summary":"数字不变；区分分母收缩的比率效应和公共服务存量耗损。","original":"说明称收缩分母制造纸面改善，并消耗公共服务存量。","checked":"比率提高可由分母收缩推动；证明公共服务存量耗损还需要另外的数据。","auditIds":["L17"]}},{"id":55,"start":1092,"end":1116,"title":"财政风险的四种病理","phaseName":"风险类型 · 18:12","scene":"typology","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"18:12—18:36","cues":[{"start":1092.3,"end":1100.52,"text":"最后一个就是云南和贵州，他们现在已经进入到了这个存量锁定的阶段，就是它的这个风险已经很难在恶化，"},{"start":1100.84,"end":1105.18,"text":"但是它也没有办法好转，它只能去慢慢的调整它的这个偿付的节奏。"},{"start":1105.36,"end":1108.58,"text":"那这个报告在数据和方法上面有哪些局限呢？"},{"start":1109.0400000000002,"end":1112.0,"text":"这个报告的话，其实有三个比较明显的边界。"},{"start":1112.5400000000002,"end":1119.36,"text":"第一个就是数据的缺口，就有五项指标，是根本就找不到省级的公开数据的。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":56,"start":1116,"end":1128,"title":"三条边界：方法、口径与时点","phaseName":"使用边界 · 18:36","scene":"boundary","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"18:36—18:48","cues":[{"start":1119.92,"end":1126.7,"text":"然后我们在处理的时候，虽然说我们保持了这个权重的逻辑，但是因为各个省份它披露的项目不一样，"}],"auditIds":["L01","L02","L16","P05"],"narration_free":false,"empty_reason":""},{"id":57,"start":1128,"end":1164,"title":"模型未计入的隐患","phaseName":"未量化部分 · 18:48","scene":"blind","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"18:48—19:24","cues":[{"start":1127.06,"end":1129.08,"text":"所以它还是会有一些不可比的偏差。"},{"start":1129.76,"end":1132.52,"text":"第二个就是这个基期的选择，"},{"start":1133.26,"end":1142.76,"text":"就分省的这个指数的基期和全国版的是不一样的，所以它这个分是可以比的，但是这个变动的幅度是不能直接跨区域比较的。"},{"start":1143.4,"end":1148.78,"text":"第三个就是我们用这个预算进度的缺口来衡量这个支出的压力。"},{"start":1149.34,"end":1152.58,"text":"那如果说这个省份年初的预算定的就很松的话，"},{"start":1153.3,"end":1154.54,"text":"那这个压力就会被低估。"},{"start":1154.54,"end":1159.98,"text":"今天我们把28个省份的财政压力拆开揉碎给大家讲了一遍。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":58,"start":1164,"end":1176,"title":"总量之外的结构风险","phaseName":"结构判断 · 19:24","scene":"summary","theme":"dark","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"19:24—19:36","cues":[{"start":1160.48,"end":1167.9,"text":"其实大家可以看到，无论是高财力还是低财力，大家都有自己的风险点，然后也都有自己的结构性的矛盾，"},{"start":1168.36,"end":1174.06,"text":"所以我们不能只看表面的数字，更多的还是要去关注背后的这些变化和成因。"}],"auditIds":[],"narration_free":false,"empty_reason":""},{"id":59,"start":1176,"end":1180.202948,"title":"数据来源与口径","phaseName":"来源 · 19:36","scene":"sources","theme":"paper","source":"按可见元素重绘；数据与原文边界见审计","timeLabel":"19:36—19:40","cues":[{"start":1174.22,"end":1179.96,"text":"好了，那这期节目咱们就到这里了，然后感谢大家的收听，咱们下期再见吧，拜拜。"},{"start":1179.96,"end":1180.08,"text":"拜拜。"}],"auditIds":["L01","L02","L13","L16"],"narration_free":false,"empty_reason":""}],"data":{"high":[["上海",34203,31.4],["北京",30645,44.4],["天津",16301,62.8],["浙江",13230,45.4],["内蒙古",12659,57.8],["江苏",12028,49.9],["广东",10841,50.6],["新疆",10090,64.0],["山西",9400,60.5],["福建",8887,47.9],["重庆",8585,69.8],["海南",8566,58.7],["陕西",8357,63.4],["山东",7831,50.0]],"low":[["湖北",7247,56.2],["辽宁",7065,58.1],["四川",7032,56.0],["江西",6882,77.5],["安徽",6836,54.5],["河北",5981,53.3],["吉林",5878,67.4],["贵州",5764,64.0],["湖南",5403,61.0],["黑龙江",5115,68.2],["云南",4831,67.6],["河南",4615,58.8],["甘肃",4554,57.6],["广西",3853,68.6]],"blocks":{"names":["A 财力造血","B 收支平衡","C 负债挤压","D 流动性"],"weights":[35,30,25,10],"all":[37.3,61.5,83.9,57.8],"high":[35.6,54.0,79.4,61.2],"low":[39.0,68.9,88.4,56.1]},"headroom":[["广东",0.86],["河北",3.13],["山东",3.93],["吉林",3.96],["浙江",4.08],["福建",4.36],["海南",4.6],["江西",4.89],["广西",4.9],["新疆",5.0]]},"audit":{"summary":"内部图表审计与公开引用核验；非公开底稿未提供，不能认证LFCRI原始评分","findings":[{"id":"L01","status":"limited","title":"底稿非公开，不能冒充完整原文复算","claim":"视频称依据LFCRI分省报告。","evidence":"用户提供的是首期发布报告的参考文献截图，未包含分省报告正文、表格、子指标阈值与缺失值处理。13项引用只能支持对应公开资料，不能验证全部28省分数。","times":[0,12,1116,1176],"sources":["U1"],"calculation":"","scope":"来源审计边界"},{"id":"L02","status":"limited","title":"报告期与数据截点须区分","claim":"片名、页脚写2026年前三季度。","evidence":"1116秒画面明确写数据截至2026年上半年；1176秒列出各省上半年预算执行和2026H1平台融资。报告发布期不等于数据覆盖期，应注明半年数据，不能说已覆盖三季度省级执行。","times":[12,1116,1176],"sources":["F1","F2","F7"],"calculation":"","scope":"时点披露"},{"id":"L03","status":"issue","title":"低财力组橙区数量：9应核为7","claim":"384秒表格标题写“橙区9省”。","evidence":"按同页14个综合分及60—79分规则，橙区为江西、吉林、贵州、湖南、黑龙江、云南、广西，共7省；另7省黄色。重复出现的同表标题仍写9。","times":[384,432,516,552],"sources":[],"calculation":"sum(60 ≤ score < 80) = 7","scope":"可见表格内部核验"},{"id":"L04","status":"issue","title":"最大组间差是B，不是A、C","claim":"420秒副标题写“A、C两组差距最大”。","evidence":"同页显示差值A=3.4、B=14.9、C=9.0、D=5.1。最大为B，第二为C，A最小；副标题与自己的图值不符。","times":[420],"sources":[],"calculation":"|low − high| = [3.4, 14.9, 9.0, 5.1]","scope":""},{"id":"L05","status":"issue","title":"D组间差不是15分以上","claim":"216秒页底写“B、D两极分化：相差15分以上”。","evidence":"B差14.9约15，D差只有5.1。D的“15分以上”无法由所列数值支持。","times":[216,228],"sources":[],"calculation":"61.2 − 56.1 = 5.1","scope":""},{"id":"L06","status":"limited","title":"D总体均值的样本口径未闭合","claim":"216秒总体D均值57.8，两组为61.2和56.1。","evidence":"按图标28省、两组各14，相同样本下应为58.65；但片尾又列15省融资统计。若实际D样本是高组5省、低组10省，加权恰为57.8。这只是可能解释，不是对底稿样本的认定；需要披露各板实际样本数，不能直接断言57.8算错。","times":[216,228,396,420],"sources":[],"calculation":"(14×61.2 + 14×56.1) / 28 = 58.65","scope":""},{"id":"L07","status":"limited","title":"固定权重演算与样本、缺项规则需补齐","claim":"权重35%、30%、25%、10%，总体板块均值37.3、61.5、83.9、57.8，综合均值58.0。","evidence":"若28省都用这组固定板块权重，则均值应服从线性加权，得到58.26。高财力组同样按图列板块得54.63，表内综合分均值约54.04。缺项、不同样本或变权规则可能改变结果；原文未提供，不能将条件演算认定为真实LFCRI数值错误。","times":[120,132,216,348,420],"sources":[],"calculation":"37.3×.35 + 61.5×.30 + 83.9×.25 + 57.8×.10 = 58.26","scope":"条件：同样本、固定板块权重；需底稿解释差异"},{"id":"L08","status":"issue","title":"散点纵坐标与数值标签失配","claim":"576秒吉林标847%，云南标817%。","evidence":"按图中200/400/600/800刻度读图，吉林点约在750%，云南点约在720%，偏差接近100个百分点。读图值为近似，但远超数值取整或像素误差。","times":[576,588,600,612],"sources":[],"calculation":"吉林：标签847，对应位置约750；云南：标签817，对应位置约720","scope":"图内标签与坐标核验；不验证真实省级债务比"},{"id":"L09","status":"issue","title":"散点上海、天津位置与片内别页数字不符","claim":"散点上海约73%/250%，天津约60%/800%。","evidence":"片内明确上海自给率约93%、债务比约122%；天津82.69%、679.6%。图点不是这些指标的位置。校核视图只使用本片明确数字，不补造其余省份。","times":[576,660,792],"sources":[],"calculation":"校核点：上海(93,122)，天津(82.69,679.6)","scope":""},{"id":"L10","status":"issue","title":"“负债端全面橙区”与分区规则不符","claim":"216秒标题称负债端全面落在橙区，C均值83.9。","evidence":"同片定义80—100为红区，83.9应属红区；且上海C=46.3，不能把所有省都称橙区。可以说负债压力普遍较高，不能说全体同一分区。","times":[132,156,216,240],"sources":[],"calculation":"83.9 ≥ 80；上海46.3 ∈ [40,60)","scope":""},{"id":"L11","status":"issue","title":"四省病理图的概述与柱值失配","claim":"996秒称吉林A/B/C“全线危重高压”。","evidence":"同图吉林A=47、B=32、C=92；按片内规则分别黄、绿、红。B=32与“全线危重”不符。原图D部分标“无”，不能补成0。","times":[996,1056],"sources":[],"calculation":"吉林 A/B/C = 47/32/92 → 黄/绿/红","scope":""},{"id":"L12","status":"inference","title":"额度空间不是永久举债能力","claim":"多页把低剩余额度推至“彻底失去继续扩张负债能力”。","evidence":"余额/限额是特定时点的约束，预算新增额度、结存额度安排和转移支付会改变约束。截图引用的2026预算及10月5500亿元结存限额文件本身包含动态政策。不能据此直接预测永久没有融资途径。","times":[276,300,936,948],"sources":["F5","F9"],"calculation":"","scope":"条件性政策推论"},{"id":"L13","status":"limited","title":"28省合计不能直接当作全国三季度数","claim":"口述将28省余额53.99、限额57.10描述为全国约束。","evidence":"视频剔除西藏、青海、宁夏；F7是全国8月余额59.8955万亿元，F5是2026全年法定限额63.18743万亿元。样本和时点不同，不能互相直接替代或据不相等判原数据虚假。","times":[276,312,1176],"sources":["F5","F7"],"calculation":"(188689.22 + 443185.08) / 10000 = 63.18743万亿元","scope":""},{"id":"L14","status":"limited","title":"口述极差21.3须回听原音","claim":"387.9秒转写记21.3，546.96秒记24.2。","evidence":"可见低组表最大77.5、最小53.3，极差24.2。这里标为转写/原音待确认，不以单次ASR确定作者口误；原视频与转写错误必须区分。","times":[384,388,547,552],"sources":[],"calculation":"77.5 − 53.3 = 24.2","scope":"待原音听核"},{"id":"L15","status":"inference","title":"改善被称“虚假复苏”需额外依据","claim":"636秒山西、内蒙古卡片标题称虚假复苏。","evidence":"可见数据说明A/B修复与C存量压力并存，不足以证明改善完全虚假或只由资源价格推动。需要省级收入结构、价格和底稿分解证据；本次材料未补齐。","times":[624,636],"sources":["F3","F13"],"calculation":"","scope":""},{"id":"L16","status":"limited","title":"缺项与“可算省份”列解释不足","claim":"120秒表可算省份写1/2/1/1，1116秒称12项只有4项全省算全。","evidence":"未披露每个缺失指标的代理、重标权重和统一评分阈值。不能仅凭有12项/35-30-25-10权重就复算或认可28省可比性。","times":[120,1116,1176],"sources":[],"calculation":"","scope":""},{"id":"P01","status":"pass","title":"28省总体分区与极差可对上","claim":"总体1绿、15黄、12橙、0红，极差46.1。","evidence":"按视频两张14省表的显示值，分区计数、最大江西77.5和最小上海31.4一致。","times":[168,180,348,384],"sources":[],"calculation":"77.5 − 31.4 = 46.1；分区计数1/15/12/0","scope":""},{"id":"P02","status":"pass","title":"8.01分可以复算，不能误判","claim":"两组差由5.55扩大至8.01。","evidence":"从14+14省表计算，高组均值54.042857、低组62.057143，差8.014286约8.01；只拿已取整54.0和62.1相减会造成误判。","times":[348,384,528],"sources":[],"calculation":"62.057143 − 54.042857 = 8.014286 ≈ 8.01","scope":""},{"id":"P03","status":"pass","title":"5.4%剩余额度算术成立","claim":"图中余额53.99、限额57.10、剩余3.11万亿元。","evidence":"使用该图自己的精确显示值可以得到约5.4%。此核验不证明28省原始数据真实或可代表全国。","times":[276,288],"sources":[],"calculation":"(57.10 − 53.99) / 57.10 ×100 = 5.4466% ≈ 5.4%","scope":""},{"id":"P04","status":"pass","title":"9省小于5%，新疆是参照项","claim":"图中10个柱，文字写九省低于5%。","evidence":"显示值中前9省严格小于5，新疆等于5.00，应作为阈值参照；10根柱不等于文案计数错误。","times":[276],"sources":[],"calculation":"count(headroom < 5.00) = 9","scope":""},{"id":"P05","status":"pass","title":"“指数不是评级”边界值得保留","claim":"六条判断及边界页声明排序不构成偿债能力评级。","evidence":"复原网页保留这一约束，不把分数解释成违约概率或官方评级。","times":[48,156,1116],"sources":[],"calculation":"","scope":""},{"id":"L17","status":"inference","title":"比率改善不能直接证明公共服务存量耗损","claim":"天津卡片称支出缩减导致虚假的自给率改善并消耗公共服务存量。","evidence":"支出增速与自给率可以说明流量或分母变化，不能单独证明服务质量、资产或存量耗损；本次资料没有补齐这项结果证据。","times":[792,1080],"sources":["F5"],"calculation":"","scope":""},{"id":"L18","status":"issue","title":"A板块低风险分不能读成造血能力弱","claim":"216秒脚注说A均值37.3说明造血能力整体偏弱。","evidence":"本片定义指数越高压力越大，A37.3是相对较低的压力分，并非低能力评分；不能反读成造血能力弱，也不能反过来仅据此证明绝对财力强。","times":[216,228],"sources":[],"calculation":"压力分37.3 < 40；能力强弱与风险分方向须分清","scope":""}],"sources":[{"id":"U1","title":"LFCRI报告及参考文献页","publisher":"用户告知报告非公开","url":null,"status":"只有参考文献截图，无分省底稿正文；原图仅本地保存"},{"id":"F1","title":"2026年前三季度财政收支情况新闻发布会文字实录","url":"https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/202610/t20261023_4003429.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F2","title":"2026年前三季度财政收支情况","url":"https://gks.mof.gov.cn/tongjishuju/202610/t20261023_4003380.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F3","title":"2025年前三季度财政收支情况新闻发布会文字实录","url":"https://bgt.mof.gov.cn/zhuantilanmu/rdwyh/czyw/202510/t20251017_3974415.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F4","title":"2024年财政收支情况","url":"https://m.mof.gov.cn/czsj/202501/t20250124_3955083.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F5","title":"关于2025年中央和地方预算执行情况与2026年中央和地方预算草案的报告","url":"https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/202603/t20260316_3985331.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F6","title":"F6（截图引用）","url":"https://www.npc.gov.cn/c2/c30834/202608/t20260831_457292.html","publisher":"截图引用的公开出处","status":"访问失败，不能据此判来源不存在"},{"id":"F7","title":"2026年8月地方政府债券发行和债务余额情况","url":"https://zwgls.mof.gov.cn/tjsj/202609/t20260924_3998108.htm","publisher":"截图引用的公开出处","status":"公开原文已取得"},{"id":"F8","title":"F8（截图引用）","url":"https://m.chinanews.com/wap/detail/chs/zw/jw694467.shtml","publisher":"截图引用的公开出处","status":"访问失败，不能据此判来源不存在"},{"id":"F9","title":"财政部安排使用5500亿元地方政府债务结存限额__中国政府网","url":"https://www.gov.cn/lianbo/202 <script>const DECK=JSON.parse(document.getElementById('deck-data').textContent);let CHECKED_VIEW=false, AUDIT_ALL=false, GALLERY_DIFFS=false;
function comparisonFor(s){return s.comparison??(DECK.caseId==='BV1JXxB6rErv'?{kind:'source',label:'原文对照',summary:'并列查看作者重点与求是原文依据；这不等于本页存在错误。',original:s.title,checked:DECK.audit.findings.find(c=>s.auditIds.includes(c.id))?.evidence??'本页为作者概括；原文出处和完整审计见右侧。',auditIds:s.auditIds}:null);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(html,n=1,extra='')=>`<div class="fragment ${extra}" data-order="${n}">${html}</div>`;
const color=v=>v<40?'#58aa76':v<60?'#d5b64a':v<80?'#d78246':'#cf5061';
const legend=()=>'<div class="score-legend">'+[['#58aa76','0—39'],['#d5b64a','40—59'],['#d78246','60—79'],['#cf5061','80—100']].map(x=>`<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join('')+'</div>';
const card=(title,lines,n=1)=>F(`<article class="scene-card"><h3>${esc(title)}</h3>${lines.map(t=>`<p>${t}</p>`).join('')}</article>`,n);
const cards=(items,cols=2)=>`<div class="scene-columns" style="--cols:${cols}">${items.map((x,i)=>card(x[0],x.slice(1),Math.min(i+1,3))).join('')}</div>`;
function axes(max=100,labels=[]){let s='';for(let v=0;v<=max;v+=max/5){let y=285-v/max*250;s+=`<line class="grid" x1="65" y1="${y}" x2="890" y2="${y}"/><text x="47" y="${y+5}" font-size="13" text-anchor="end">${Math.round(v)}</text>`;}return s;}
function bars(labels,series,max=100){let s=axes(max);const groupWidth=790/labels.length,colors=['#4897a6','#df9c49','#cb6c7e','#74b582'];series.forEach((row,j)=>row.values.forEach((v,i)=>{const x=83+i*groupWidth+j*(groupWidth/(series.length+1));if(v===null){s+=`<text x="${x+12}" y="272" font-size="11">未给</text>`;return;}const h=v/max*250,w=groupWidth/(series.length+1)-10;s+=`<rect class="bar" x="${x}" y="${285-h}" width="${w}" height="${h}" fill="${row.color??colors[j]}"/><text x="${x+w/2}" y="${276-h}" font-size="14" text-anchor="middle">${v}</text>`;}));labels.forEach((l,i)=>s+=`<text x="${83+i*groupWidth+groupWidth*.35}" y="311" font-size="14" text-anchor="middle">${esc(l)}</text>`);s+=series.map((row,j)=>`<rect x="${75+j*235}" y="4" width="12" height="12" fill="${row.color??colors[j]}"/><text x="${94+j*235}" y="15" font-size="13">${esc(row.name)}</text>`).join('');return F(`<svg class="deck-chart" viewBox="0 0 920 330" role="img" aria-label="数值柱状图">${s}</svg>`,2);}
function table(which){const rows=DECK.data[which];return F(`<table class="data-table"><thead><tr><th>省份</th><th>人均一般预算收入（元）</th><th>综合分</th><th>分区</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1].toLocaleString('en-US')}</td><td class="score" style="background:${color(x[2])}">${x[2]}</td><td>${x[2]<40?'绿':x[2]<60?'黄':x[2]<80?'橙':'红'}</td></tr>`).join('')}</tbody></table>`,1)+legend();}
function ranking(){const rows=[...DECK.data.high,...DECK.data.low].sort((a,b)=>b[2]-a[2]);return F(`<div class="rank-grid">${rows.map(x=>`<div class="rank-row"><label>${x[0]}</label><span class="rank-track"><i style="width:${x[2]}%;background:${color(x[2])}"></i></span><b>${x[2]}</b></div>`).join('')}</div>`,1)+legend();}
function weights(){return `<div class="model-cards">${DECK.data.blocks.names.map((name,i)=>F(`<div class="model-card"><h3>${name}</h3><svg viewBox="0 0 100 100" style="width:88px;height:88px"><circle cx="50" cy="50" r="40" fill="none" stroke="#84988933" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="${['#72bd95','#d9bf58','#d98747','#609faa'][i]}" stroke-width="9" stroke-dasharray="${DECK.data.blocks.weights[i]*2.513} 251.3" transform="rotate(-90 50 50)"/></svg><div class="weight">${DECK.data.blocks.weights[i]}%</div><p>${['一般公共预算收入底盘','收入与支出进度','存量债务及限额空间','融资与到期接续'][i]}</p></div>`,i+1)).join('')}</div>`;}

const $ = id => document.getElementById(id);

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function notify(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3200);}
function slideAt(t){for(let i=DECK.slides.length-1;i>=0;i--)if(t>=DECK.slides[i].start-.005)return i;return 0;}
function resize(){const width=host.clientWidth;stage.style.transform=`scale(${width/1000})`;document.querySelectorAll('.mini').forEach(m=>{m.querySelector('.canvas').style.transform=`scale(${m.clientWidth/1000})`;});}
new ResizeObserver(resize).observe(host);
function animateNumbers(){cancelAnimationFrame(state.counterFrame);const nodes=[...stage.querySelectorAll('[data-count]')].filter(n=>n.closest('.fragment').classList.contains('revealed'));if(reduced){nodes.forEach(n=>n.textContent=Number(n.dataset.count).toFixed(Number(n.dataset.digits)));return;}const begin=performance.now();function frame(now){let done=true;for(const n of nodes){const delay=(Number(n.closest('.fragment').dataset.order)-1)*320;const p=Math.min(1,Math.max(0,(now-begin-delay)/1050));n.textContent=(Number(n.dataset.count)*(1-Math.pow(1-p,3))).toFixed(Number(n.dataset.digits));if(p<1)done=false;}if(!done)state.counterFrame=requestAnimationFrame(frame);}state.counterFrame=requestAnimationFrame(frame);}
function fragments(){stage.querySelectorAll('.fragment').forEach(el=>{const order=Number(el.dataset.order)||1;el.style.setProperty('--delay',state.stepMode?'0ms':`${(order-1)*320}ms`);el.classList.toggle('revealed',!state.stepMode||order<=state.step);});$('step-next').hidden=!state.stepMode;$('step-next').textContent=state.step>=state.maxStep?'本页已展开':`展开一步 ${state.step}/${state.maxStep}`;$('step-next').disabled=state.step>=state.maxStep;$('step-mode').setAttribute('aria-pressed',String(state.stepMode));animateNumbers();}
function renderTranscript(s){$('subtitle-title').textContent=s.title;$('subtitle-range').textContent=`${mmss(s.start)}—${mmss(s.end)}`;$('subtitle-page').textContent=`第 ${state.index+1} 页 · ${s.phaseName}`;$('subtitle-body').innerHTML=s.cues.length?s.cues.map((c,i)=>`<tr data-segment="${i}" tabindex="0" aria-label="从${mmss(c.start)}播放原声"><td>${mmss(c.start)}</td><td>${esc(c.text)}</td></tr>`).join(''):`<tr><td>—</td><td>${esc(s.empty_reason||'本页口播请结合前后页。')}</td></tr>`;$('subtitle-scroll').scrollTop=0;state.activeRow=-1;}
function renderSlide(index,{seek=true,transition=true}={}){index=Math.max(0,Math.min(DECK.slides.length-1,index));const s=DECK.slides[index];if(!comparisonFor(s))CHECKED_VIEW=false;if(transition&&!reduced&&stage.innerHTML){host.querySelectorAll('.outgoing').forEach(n=>n.remove());const old=stage.cloneNode(true);old.removeAttribute('id');old.classList.add('outgoing','freeze');old.setAttribute('aria-hidden','true');old.style.pointerEvents='none';host.append(old);old.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out'}).finished.then(()=>old.remove()).catch(()=>old.remove());}
state.index=index;state.step=1;state.virtualTime=s.start;stage.innerHTML=canvasHTML(s,index);stage.setAttribute('aria-label',`第${index+1}张幻灯片：${s.title}，${s.phaseName}`);state.maxStep=Math.max(...[...stage.querySelectorAll('[data-order]')].map(n=>Number(n.dataset.order)),1);
$('page-select').value=String(index);$('page-count').innerHTML=`${String(index+1).padStart(2,'0')} <span>/ ${DECK.slides.length}</span>`;$('previous').disabled=index===0;$('next').disabled=index===DECK.slides.length-1;$('slide-range').value=index;$('slide-range').style.setProperty('--fill',`${index/(DECK.slides.length-1)*100}%`);$('phase-name').textContent=s.phaseName;$('source-range').textContent=`原视频 ${mmss(s.start)}—${mmss(s.end)}`;
renderTranscript(s);renderAudit(s);renderComparison(s);resize();requestAnimationFrame(fragments);if(seek){try{audio.currentTime=s.start;}catch{}if(state.auto)state.clock=performance.now();}try{history.replaceState(null,'',`#slide=${index+1}`);}catch{}if(transition&&!reduced)stage.animate([{opacity:.15},{opacity:1}],{duration:330,easing:'ease-out'});highlight(s.start);}
function highlight(time){const cues=DECK.slides[state.index].cues;if(!cues.length)return;let i=cues.findIndex(c=>time>=c.start&&time<c.end);if(i<0){i=0;for(let j=0;j<cues.length;j++)if(time>=cues[j].start)i=j;}if(i===state.activeRow)return;state.activeRow=i;const rows=$('subtitle-body').querySelectorAll('tr');rows.forEach((r,j)=>r.classList.toggle('active',j===i));const row=rows[i],scroller=$('subtitle-scroll');if(row){const top=row.offsetTop;const header=30;if(top<scroller.scrollTop+header||top+row.offsetHeight>scroller.scrollTop+scroller.clientHeight)scroller.scrollTo({top:Math.max(0,top-header-12),behavior:reduced?'auto':'smooth'});}}
function updateAudioUI(){const playing=!audio.paused;$('audio-toggle').disabled=!narrationAvailable;$('audio-toggle').setAttribute('aria-label',narrationAvailable?'播放或暂停原视频音频':'原声仅本地提供，可通过原视频链接收听');$('audio-toggle').setAttribute('aria-pressed',String(playing));$('audio-toggle').innerHTML=narrationAvailable?`${uiIcon(playing?'pause':'play')}<span>${playing?'暂停原声':'播放原声'}</span>`:`${uiIcon('play')}<span>原声仅本地提供</span>`;$('audio-toggle').title=narrationAvailable?'播放或暂停原声':'可通过原视频链接收听讲解';$('mode-dot').classList.toggle('playing',playing||state.auto);$('playback-label').textContent=playing?'原声跟随':state.auto?'自动演示':'自由翻页';$('auto-toggle').setAttribute('aria-pressed',String(state.auto));$('auto-toggle').textContent=state.auto?'暂停演示':'自动演示';}
async function playAt(time){if(!narrationAvailable){notify('原声仅本地提供，可通过上方原视频链接收听；仍可自由翻页或自动演示。');return;}state.auto=false;try{audio.currentTime=time;await audio.play();updateAudioUI();}catch(e){notify('原声暂时无法播放，请确认音频文件与网页在同一文件夹；仍可自由翻页。');updateAudioUI();}}

$('page-select').innerHTML=DECK.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)} · ${esc(s.phaseName)}</option>`).join('');$('slide-range').max=DECK.slides.length-1;$('previous').innerHTML=uiIcon('left');$('next').innerHTML=uiIcon('right');$('gallery-open').innerHTML=uiIcon('grid')+'全部页面';$('fullscreen').innerHTML=uiIcon('full')+'<span>全屏</span>';$('replay').innerHTML=uiIcon('replay')+'重播动效';$('gallery-close').innerHTML=uiIcon('close');

function galleryCanvas(s,i){const previous=CHECKED_VIEW;try{if(!comparisonFor(s))CHECKED_VIEW=false;return canvasHTML(s,i);}finally{CHECKED_VIEW=previous;}}
function buildGallery(query=''){

 const matches=DECK.slides.map((s,i)=>({s,i,c:comparisonFor(s)})).filter(({s,c})=>(!GALLERY_DIFFS||c)&&(s.title+' '+s.phaseName+' '+s.cues.map(c=>c.text).join('')+' '+(c?c.summary+' '+c.original+' '+c.checked:'')).toLowerCase().includes(query));

let lastUpdate=0;function tick(now){if(now-lastUpdate>120){let t=null;if(!audio.paused)t=audio.currentTime;else if(state.auto){state.virtualTime+=(now-state.clock)/1000;state.clock=now;t=state.virtualTime;if(t>=DECK.duration){state.auto=false;updateAudioUI();t=DECK.duration-.02;}}if(t!==null){const i=slideAt(t);if(i!==state.index){renderSlide(i,{seek:false});state.virtualTime=t;state.clock=now;}highlight(t);$('play-time').textContent=`${mmss(t)} / ${mmss(DECK.duration)}`;}lastUpdate=now;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
